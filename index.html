<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>番茄钟 · 学习工作台</title>
<style>
/* ============ 基础变量 ============ */
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
:root{
  --radius:18px;
  --card-bg:rgba(255,255,255,.78);
  --card-solid:#ffffff;
  --card-border:rgba(120,150,200,.24);
  --text:#1b2432;
  --muted:#6d7b8e;
  --bg1:#e9f1fd;
  --bg2:#f8fbff;
  --accent:#3b82f6;
  --accent2:#60a5fa;
  --shadow:0 10px 32px rgba(60,90,140,.13);
}
body.dark{
  --card-bg:rgba(16,30,48,.76);
  --card-solid:#101f31;
  --card-border:rgba(90,180,230,.22);
  --text:#dcecfb;
  --muted:#8aa6c2;
  --bg1:#070e18;
  --bg2:#0c1826;
  --shadow:0 10px 34px rgba(0,20,40,.55);
}
body[data-mode="time"]{--accent:#17a89a;--accent2:#4dd6c4;}
body[data-mode="pomo"]{--accent:#e2603f;--accent2:#ff9a72;}
body[data-mode="sched"] {--accent:#10b981;--accent2:#34d399;}
body[data-mode="exam"] {--accent:#8b5cf6;--accent2:#a78bfa;}
body.dark[data-mode="time"]{--accent:#2fd0d8;--accent2:#8bf5ec;}
body.dark[data-mode="pomo"]{--accent:#38b6ee;--accent2:#8ad9ff;}
body.dark[data-mode="sched"] {--accent:#2dd4bf;--accent2:#5eead4;}
body.dark[data-mode="exam"] {--accent:#a78bfa;--accent2:#c4b5fd;}

html,body{height:100%;}
body{
  margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  color:var(--text);background:linear-gradient(160deg,var(--bg1) 0%,var(--bg2) 100%);
  background-attachment:fixed;transition:background .6s ease,color .4s ease;
  overflow-x:hidden;-webkit-text-size-adjust:100%;text-size-adjust:100%;touch-action:manipulation;
}

/* ============ 背景漂浮图 ============ */
#bgLayer{position:fixed;inset:0;overflow:hidden;z-index:0;pointer-events:none;}
.float-img{
  position:absolute;background-size:cover;background-position:center;border-radius:24px;opacity:.16;filter:blur(.5px) saturate(.85);
  animation-name:drift;animation-timing-function:ease-in-out;animation-iteration-count:infinite;will-change:transform;
}
body.dark .float-img{opacity:.10;}
@keyframes drift{
  0%  {transform:translate(0,0) rotate(0deg) scale(1);}
  25% {transform:translate(var(--dx1),var(--dy1)) rotate(var(--rot)) scale(1.06);}
  50% {transform:translate(var(--dx2),var(--dy2)) rotate(calc(var(--rot) * -1)) scale(.95);}
  75% {transform:translate(var(--dx3),var(--dy3)) rotate(var(--rot)) scale(1.03);}
  100%{transform:translate(0,0) rotate(0deg) scale(1);}
}

/* ============ 头部 ============ */
header{
  position:fixed;top:0;left:0;right:0;z-index:40;min-height:72px;
  display:grid;grid-template-columns:1fr auto 1fr;align-items:center;
  gap:10px;padding:0 16px;padding-top:env(safe-area-inset-top);
}
.tabs{
  grid-column:2;display:flex;gap:6px;padding:6px;border-radius:999px;
  background:var(--card-bg);border:1px solid var(--card-border);
  -webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);
  box-shadow:var(--shadow);overflow-x:auto;
}
.tabs button{
  border:none;background:transparent;color:var(--muted);padding:10px 18px;border-radius:999px;
  font-size:15px;font-weight:700;cursor:pointer;transition:all .25s;font-family:inherit;white-space:nowrap;touch-action:manipulation;
}
.tabs button.active{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;box-shadow:0 6px 18px rgba(0,0,0,.18);}
.top-right{grid-column:3;justify-self:end;display:flex;gap:8px;}
.icon-btn{
  border:1px solid var(--card-border);background:var(--card-bg);color:var(--text);
  -webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);padding:10px 15px;border-radius:12px;
  font-size:14px;font-weight:600;cursor:pointer;transition:.22s;font-family:inherit;box-shadow:var(--shadow);
  display:flex;align-items:center;gap:6px;min-height:44px;touch-action:manipulation;
}
.icon-btn:hover{border-color:var(--accent);color:var(--accent);}

/* ============ 主体 ============ */
main{position:relative;z-index:10;padding:92px 18px 70px;max-width:1180px;margin:0 auto;}
.view{display:none;}
.view.active{display:block;animation:fadeUp .35s ease;}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px);}to{opacity:1;transform:none;}}

/* ============ 卡片 / 按钮 ============ */
.card{
  background:var(--card-bg);border:1px solid var(--card-border);border-radius:var(--radius);padding:22px;margin-bottom:20px;
  box-shadow:var(--shadow);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);transition:background .4s,border-color .4s;
}
.card-head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:16px;}
.card-head h3{margin:0;font-size:16px;font-weight:700;letter-spacing:.02em;}
.head-tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap;}

button{font-family:inherit;}
.primary{
  background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;border:none;padding:12px 22px;border-radius:12px;
  font-weight:700;font-size:14px;cursor:pointer;transition:.22s;box-shadow:0 6px 18px rgba(0,0,0,.14);min-height:44px;touch-action:manipulation;
}
.primary:active{transform:scale(.98);}
.ghost{
  background:transparent;border:1px solid var(--card-border);color:var(--text);padding:11px 18px;border-radius:12px;
  font-weight:600;font-size:14px;cursor:pointer;transition:.22s;min-height:44px;touch-action:manipulation;
}
.ghost:hover{border-color:var(--accent);color:var(--accent);}
.ghost.danger:hover{border-color:#ef4444;color:#ef4444;}
.ghost:active{transform:scale(.98);}
.mini{padding:7px 13px;font-size:12.5px;border-radius:9px;min-height:36px;}
.big{padding:14px 34px;font-size:15px;}

input[type=number],input[type=text],input[type=date],input[type=time],select,textarea{
  background:rgba(255,255,255,.66);border:1px solid var(--card-border);color:var(--text);border-radius:11px;padding:11px 13px;
  font-size:16px;font-family:inherit;outline:none;transition:.22s;width:100%;min-height:44px;
}
body.dark input[type=number],body.dark input[type=text],body.dark input[type=date],body.dark input[type=time],body.dark select,body.dark textarea{background:rgba(255,255,255,.06);}
input:focus,select:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(80,140,255,.16);}

/* ============ 补充缺失样式 ============ */
.muted{color:var(--muted);font-size:13px;}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:12px;font-size:13px;font-weight:600;color:var(--muted);}
.field > span{font-size:12.5px;}
.legend-item{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:8px;font-size:13px;transition:background .2s;}
.legend-item:hover{background:rgba(130,150,190,.1);}
.legend-dot{width:10px;height:10px;border-radius:3px;flex-shrink:0;}
.legend-name{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600;color:var(--text);}
.legend-val{color:var(--muted);font-size:12px;font-weight:600;white-space:nowrap;}

/* ============ 时间模式切换器（弹窗内） ============ */
.time-mode-tabs {display: inline-flex;gap: 4px;padding: 4px;border-radius: 999px;background: rgba(130,150,190,.14);margin-bottom: 14px;}
.time-mode-tabs button {border: none;background: transparent;color: var(--muted);padding: 8px 20px;border-radius: 999px;font-size: 13px;font-weight: 700;cursor: pointer;transition: all .2s;font-family: inherit;}
.time-mode-tabs button.active {background: var(--card-solid);color: var(--accent);}

/* ============ 表格 ============ */
.table-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;}
table{width:100%;border-collapse:collapse;font-size:14px;}
th,td{padding:11px 12px;text-align:left;border-bottom:1px solid var(--card-border);white-space:nowrap;}
th{color:var(--muted);font-weight:700;font-size:12.5px;letter-spacing:.04em;}
tbody tr:hover{background:rgba(120,160,220,.09);}
td.op-cell{white-space:nowrap;}
td.op-cell button{margin-right:6px;}
td.op-cell button:last-child{margin-right:0;}
.empty{text-align:center;color:var(--muted);padding:26px 0;font-size:14px;white-space:normal;}

/* ============ 日程计划表 ============ */
.schedule-wrap {overflow-x: auto;-webkit-overflow-scrolling: touch;max-height: 65vh;overflow-y: auto;border-radius: 12px;border: 1px solid var(--card-border);}
#schedTable {border-collapse: separate;border-spacing: 0;width: max-content;}
#schedTable th, #schedTable td {border-right: 1px solid var(--card-border);border-bottom: 1px solid var(--card-border);padding: 8px 10px;text-align: center;vertical-align: middle;background: var(--card-solid);}
#schedTable th {position: sticky;top: 0;z-index: 3;font-size: 13px;font-weight: 700;color: var(--text);}
#schedTable th:nth-child(1), #schedTable td:nth-child(1) {position: sticky;left: 0;z-index: 2;min-width: 118px;}
#schedTable th:nth-child(2), #schedTable td:nth-child(2) {position: sticky;left: 118px;z-index: 2;min-width: 100px;}
#schedTable th:nth-child(3), #schedTable td:nth-child(3) {position: sticky;left: 218px;z-index: 2;min-width: 140px;}
#schedTable th:nth-child(1) {z-index: 4;}
#schedTable th:nth-child(2) {z-index: 4;}
#schedTable th:nth-child(3) {z-index: 4;}
#schedTable input {border: none;background: transparent;text-align: center;outline: none;min-height: auto;padding: 4px;color: var(--text);}
#schedTable input:focus {background: rgba(130,150,190,.15);border-radius: 6px;}

#schedTable td.time-cell-td {position: relative;padding-right: 30px;}
#schedTable td.time-cell-td input {font-size: 13px;padding-right: 22px;}
.time-pick-btn {
  position: absolute;right: 4px;top: 50%;transform: translateY(-50%);
  background: transparent;border: none;cursor: pointer;font-size: 14px;color: var(--muted);
  padding: 4px 6px;border-radius: 6px;transition: all .2s;line-height: 1;opacity: .55;
}
.time-pick-btn:hover {background: rgba(130,150,190,.15);color: var(--accent);opacity: 1;}

.col-del-btn {display: inline-block;margin-left: 6px;color: #ef4444;cursor: pointer;font-size: 16px;font-weight: 900;vertical-align: middle;}
.row-del-btn {color: #ef4444;background: transparent;border: none;cursor: pointer;font-size: 18px;padding: 4px 8px;}
.check-box {width: 26px;height: 26px;border: 2px solid var(--card-border);border-radius: 6px;margin: 0 auto;cursor: pointer;display: flex;align-items: center;justify-content: center;background: transparent;transition: all 0.2s;}
.check-box.state-1 {background: #22c55e;border-color: #22c55e;color: #fff;}
.check-box.state-1::after {content: '✓';font-weight: 900;font-size: 16px;}
.check-box.state-2 {background: #ef4444;border-color: #ef4444;color: #fff;}
.check-box.state-2::after {content: '✗';font-weight: 900;font-size: 16px;}

/* ============ 月历抽屉 ============ */
#drawer{
  position:fixed;top:0;right:0;bottom:0;width:min(360px,92vw);background:var(--card-solid);border-left:1px solid var(--card-border);
  z-index:900;transform:translateX(102%);transition:transform .38s cubic-bezier(.4,0,.2,1);display:flex;flex-direction:column;
  box-shadow:-24px 0 60px rgba(0,0,0,.2);padding-bottom:env(safe-area-inset-bottom);
}
#drawer.open{transform:translateX(0);}
.drawer-head{display:flex;align-items:center;justify-content:space-between;padding:18px 20px;border-bottom:1px solid var(--card-border);padding-top:calc(18px + env(safe-area-inset-top));}
.drawer-head h3{margin:0;font-size:16px;}
.drawer-body{padding:20px;overflow-y:auto;flex:1;-webkit-overflow-scrolling:touch;}
.cal-header {display: flex;justify-content: space-between; align-items: center;margin-bottom: 20px;font-size: 18px;font-weight: 700;}
.cal-header button {background: none;border: none;font-size: 24px;cursor: pointer;color: var(--text);padding: 0 10px;}
.cal-grid {display: grid;grid-template-columns: repeat(7, 1fr);gap: 6px;text-align: center;}
.cal-weekday {font-size: 12px;color: var(--muted);font-weight: 700;margin-bottom: 5px;}
.cal-day {aspect-ratio: 1;display: flex;flex-direction: column;align-items: center;justify-content: center;border-radius: 10px;cursor: pointer;font-size: 15px;position: relative;transition: background .2s;}
.cal-day:hover {background: rgba(130,150,190,.15);}
.cal-day.today {border: 2px solid var(--accent);color: var(--accent);font-weight: bold;}
.cal-day.other-month {opacity: 0.3;}
.cal-dot {width: 6px;height: 6px;border-radius: 50%;margin-top: 4px;}
.dot-green {background: #22c55e;}
.dot-red {background: #ef4444;}
.dot-yellow {background: #f59e0b;}

/* ============ 当日计划弹层 ============ */
#dailyPlanOverlay {position: fixed;inset: 0;z-index: 1000;background: rgba(8,18,32,.7);display: none;align-items: flex-start;justify-content: center;padding: 40px 20px;overflow-y: auto;-webkit-backdrop-filter: blur(5px);backdrop-filter: blur(5px);}
#dailyPlanOverlay.active {display: flex;}
.daily-box {background: var(--card-solid);border-radius: 20px;padding: 20px;width: 100%;max-width: 600px;box-shadow: 0 20px 60px rgba(0,0,0,.3);border: 1px solid var(--card-border);margin: auto 0;}
.plan-item {display: flex;align-items: center;gap: 10px;padding: 12px;border-bottom: 1px solid var(--card-border);}
.plan-item:last-child {border-bottom: none;}
.plan-info {flex: 1;display: flex;flex-direction: column;gap: 4px;}
.plan-time {font-size: 12px;color: var(--muted);font-weight: bold;}
.plan-title {font-size: 15px;font-weight: 600;}
.plan-desc {font-size: 13px;color: var(--muted);}
.photo-btn {width: 40px;height: 40px;border-radius: 10px;border: 1px dashed var(--card-border);display: flex;align-items: center;justify-content: center;font-size: 20px;cursor: pointer;background: rgba(130,150,190,.1);transition: all .2s;flex-shrink: 0;overflow: hidden;}
.photo-btn:hover {border-color: var(--accent);}
.photo-btn img {width: 100%;height: 100%;object-fit: cover;}
.photo-btn.has-photo {border-style: solid;border-color: var(--accent);}

/* ============ 行测统计表 ============ */
.exam-table-wrap {overflow-x: auto;-webkit-overflow-scrolling: touch;max-height: 70vh;border-radius: 12px;border: 1px solid var(--card-border);}
#examTable {border-collapse: separate;border-spacing: 0;width: max-content;}
#examTable th, #examTable td {border-right: 1px solid var(--card-border);border-bottom: 1px solid var(--card-border);padding: 11px 12px;text-align: center;background: var(--card-solid);white-space: nowrap;}
#examTable th {position: sticky;top: 0;z-index: 3;font-size: 13px;font-weight: 700;color: var(--text);}
#examTable td {font-size: 14px;}
#examTable a {color:var(--accent);text-decoration:none;font-weight:bold;}

/* ============ 数据分析与折线图 ============ */
.analysis-panel {margin-top: 20px;padding: 20px;border-radius: 14px;background: rgba(130,150,190,.08);border: 1px dashed var(--card-border);}
.chart-container {width: 100%;height: 250px;margin-top: 15px;}
#examChart {width: 100%;height: 100%;}
.analysis-text {margin-top: 15px;font-size: 14px;line-height: 1.8;}
.analysis-text b {color: var(--accent);}

/* ============ 弹窗基础 ============ */
#modalRoot{position:fixed;inset:0;z-index:1100;display:none;}
#modalRoot.show{display:block;}
.modal-mask{position:absolute;inset:0;background:rgba(8,18,32,.5);display:flex;align-items:flex-start;justify-content:center;overflow-y:auto;padding:clamp(16px,9vh,90px) 16px 48px;-webkit-backdrop-filter:blur(5px);backdrop-filter:blur(5px);}
.modal-box{width:min(500px,100%);background:var(--card-solid);border:1px solid var(--card-border);border-radius:20px;padding:26px;box-shadow:0 26px 70px rgba(0,0,0,.35);margin:auto 0;}
.modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:20px;flex-wrap:wrap;}
.radio-row{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:15px;}
.radio-chip{display:flex;align-items:center;gap:7px;padding:11px 16px;border-radius:11px;border:1px solid var(--card-border);cursor:pointer;font-size:14px;font-weight:600;}
.radio-chip input{accent-color:var(--accent);width:18px;height:18px;}

/* ============ 配色选择器 ============ */
.theme-picker-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin-bottom: 20px; max-height: 40vh; overflow-y: auto; padding-right: 5px; }
.theme-card { border: 1px solid var(--card-border); border-radius: 12px; padding: 10px; cursor: pointer; transition: all .2s; background: var(--card-solid); position: relative; }
.theme-card:hover { border-color: var(--accent); transform: translateY(-2px); box-shadow: 0 4px 12px rgba(0,0,0,.1); }
.theme-card.active { border-color: var(--accent); border-width: 2px; box-shadow: 0 0 0 2px rgba(80,140,255,.2); }
.theme-colors { display: flex; gap: 4px; margin-bottom: 8px; height: 30px; border-radius: 6px; overflow: hidden; }
.theme-colors div { flex: 1; }
.theme-name { font-size: 13px; font-weight: 700; text-align: center; color: var(--text); }
.custom-theme-editor { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding-top: 15px; border-top: 1px dashed var(--card-border); }
.color-field { display: flex; align-items: center; justify-content: space-between; font-size: 13px; font-weight: 600; color: var(--muted); background: rgba(130,150,190,.08); padding: 6px 10px; border-radius: 8px; }
.color-field input[type="color"] { width: 32px; height: 32px; padding: 0; border: none; background: none; cursor: pointer; outline: none; }

/* ============ 番茄钟全屏 (含翻页) ============ */
#pomoFlipOverlay {
  position: fixed; inset: 0; z-index: 999;
  background: rgba(0,0,0,0.65);
  -webkit-backdrop-filter: blur(20px); backdrop-filter: blur(20px);
  display: none; flex-direction: column; align-items: center; justify-content: center;
  color: var(--text); font-family: sans-serif;
}
#pomoFlipOverlay.active { display: flex; }
.pomo-flip-wrap { display: flex; gap: min(2vw,2vh); align-items: center; justify-content: center; margin-top: -10vh; }
.pomo-flip-group { display: flex; gap: min(1.5vw,1.5vh); }
.pomo-flip-card {
  position: relative; width: calc(min(20vw, 30vh) * 0.72); height: min(20vw, 30vh);
  background: var(--card-solid); border-radius: min(2vw,2vh);
  box-shadow: 0 10px 30px rgba(0,0,0,0.15), inset 0 0 0 1px var(--card-border);
  display: flex; align-items: center; justify-content: center;
  font-size: calc(min(20vw, 30vh) * 0.8); font-weight: 800; color: var(--accent);
  perspective: 400px;
}
.pomo-flip-card::after { content: ''; position: absolute; top: 50%; left: 0; width: 100%; height: 1px; background: var(--card-border); z-index: 2; opacity: .5; }
.pomo-flip-colon { font-size: calc(min(20vw, 30vh) * 0.6); font-weight: 800; color: var(--accent); margin: 0 min(1vw,1vh); opacity: 0.8; }
.pomo-flip-task { margin-top: 5vh; font-size: clamp(16px, 3vh, 24px); color: var(--text); opacity: .7; font-weight: 500; letter-spacing: 2px; }
.pomo-flip-ctrl { position: absolute; bottom: 8vh; display: flex; gap: 15px; }
.pomo-flip-ctrl button {
  background: var(--card-bg); border: 1px solid var(--card-border); color: var(--text);
  padding: 14px 36px; border-radius: 30px; font-size: 16px; font-weight: 700; cursor: pointer;
  transition: .2s; -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
  box-shadow: 0 4px 15px rgba(0,0,0,0.1);
}
.pomo-flip-ctrl button:hover { border-color: var(--accent); color: var(--accent); transform: scale(1.05); }
.pomo-flip-ctrl button:active { transform: scale(.95); }
.pomo-flip-anim { animation: flipDown 0.6s ease-in; }

/* ============ Toast / 闪烁 / 原翻页时钟 ============ */
#toast{position:fixed;left:50%;bottom:42px;transform:translate(-50%,26px);background:rgba(20,32,50,.92);color:#fff;padding:12px 22px;border-radius:12px;font-size:14px;font-weight:600;opacity:0;pointer-events:none;transition:.3s;z-index:2000;white-space:nowrap;}
#toast.show{opacity:1;transform:translate(-50%,0);}
#flashOverlay{position:fixed;inset:0;z-index:60;pointer-events:none;opacity:0;background:radial-gradient(circle at 50% 50%,rgba(120,210,255,.55),rgba(120,210,255,.04) 72%);}
#flashOverlay.on{animation:breathe 1s ease-in-out 5;}
@keyframes breathe{0%,100%{opacity:0;}50%{opacity:1;}}

.shake{animation:shake .5s;border-color:#ef4444 !important;}
@keyframes shake{0%,100%{transform:translateX(0);}20%{transform:translateX(-7px);}40%{transform:translateX(7px);}60%{transform:translateX(-5px);}80%{transform:translateX(5px);}}

#flipClockOverlay{position:fixed;inset:0;z-index:999;background:#000;color:#fff;display:none;flex-direction:column;align-items:center;justify-content:center;font-family:sans-serif;}
#flipClockOverlay.active{display:flex;}
.flip-wrap{display:flex;gap:min(2vw,2vh);align-items:center;justify-content:center;margin-top:-5vh;}
.flip-group{display:flex;gap:min(1.5vw,1.5vh);}
.flip-card{position:relative;width:calc(min(15vw,25vh)*0.72);height:min(15vw,25vh);background:#1a1a1a;border-radius:min(2vw,2vh);box-shadow:0 5px 15px rgba(255,255,255,0.05),inset 0 0 0 1px rgba(255,255,255,0.1);display:flex;align-items:center;justify-content:center;font-size:calc(min(15vw,25vh)*0.8);font-weight:bold;color:#fff;perspective:400px;}
.flip-card::after{content:'';position:absolute;top:50%;left:0;width:100%;height:1px;background:#000;z-index:2;}
.flip-colon{font-size:calc(min(15vw,25vh)*0.6);font-weight:bold;color:#fff;margin:0 min(1vw,1vh);opacity:0.8;}
.flip-anim{animation:flipDown 0.6s ease-in;}
@keyframes flipDown{0%{transform:rotateX(0deg);}50%{transform:rotateX(-90deg);background:#333;}100%{transform:rotateX(0deg);}}
#flipDate{margin-top:5vh;font-size:clamp(16px,3vh,24px);color:#888;font-weight:500;letter-spacing:2px;}
#flipCloseBtn{position:absolute;bottom:5vh;background:rgba(255,255,255,0.1);color:#fff;border:1px solid rgba(255,255,255,0.2);padding:12px 36px;border-radius:30px;font-size:16px;cursor:pointer;}

  .tabs button{padding:11px 20px;font-size:15px;}

}
@media (max-width:600px){

<script>
/* =====================================================================
   0. 通用工具 & 数据备份
   ===================================================================== */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const pad2 = n => String(n).padStart(2, '0');
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const escHtml = s => String(s).replace(/[&<>"']/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
const escAttr = escHtml;

const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { console.error('存储失败', e); toast('存储空间不足，建议导出备份或清理'); } },
  remove(k) { try { localStorage.removeItem(k); } catch (e) { console.error('删除失败', e); } }
};

const K_REC = 'tt_records_v1', K_TIMER = 'tt_timer_v1', K_THEME = 'tt_theme_v1', K_MODE = 'tt_mode_v1', K_LASTPJ = 'tt_last_project', K_SCHED = 'tt_sched_v1', K_EXAM = 'tt_exam_v1', K_THEME_COLOR = 'tt_theme_color_v1';

let _toastTimer = null;
function toast(msg) {
  let t = $('#toast'); if (!t) { t = document.createElement('div'); t.id = 'toast'; document.body.appendChild(t); }
  t.textContent = msg; t.classList.add('show');
  clearTimeout(_toastTimer); _toastTimer = setTimeout(() => t.classList.remove('show'), 1900);
}
function fmtMS(ms) {
  const total = Math.max(0, Math.round(ms / 1000));
  const h = Math.floor(total / 3600), m = Math.floor((total % 3600) / 60), s = total % 60;
  return h > 0 ? `${pad2(h)}:${pad2(m)}:${pad2(s)}` : `${pad2(m)}:${pad2(s)}`;
}
function fmtDateTime(ts) {
  const d = new Date(ts); return `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())} ${pad2(d.getHours())}:${pad2(d.getMinutes())}`;
}
function dateStr(d) { return `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`; }
function getWeekKey(ts) { const d = new Date(ts); d.setHours(0,0,0,0); d.setDate(d.getDate() - ((d.getDay()+6)%7)); return dateStr(d); }
function cssColor(name, fallback) { const v = getComputedStyle(document.body).getPropertyValue(name).trim(); return v || fallback; }

function parseTimeValue(str) {
  const s = String(str || '').trim();
  let m = s.match(/^(\d{1,2}:\d{2})\s*[-~—至]\s*(\d{1,2}:\d{2})$/);
  if (m) return { mode: 'range', start: m[1], end: m[2] };
  m = s.match(/^(\d{1,2}:\d{2})$/);
  if (m) return { mode: 'point', point: m[1] };
  return { mode: 'point', point: '' };
}

/* 颜色工具 */
function hexToRgb(hex) {
  let result = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
  return result ? { r: parseInt(result[1], 16), g: parseInt(result[2], 16), b: parseInt(result[3], 16) } : null;
}
function mixColors(c1, c2, weight) {
  const r1 = hexToRgb(c1), r2 = hexToRgb(c2);
  if(!r1 || !r2) return c1;
  const r = Math.round(r1.r * (1 - weight) + r2.r * weight);
  const g = Math.round(r1.g * (1 - weight) + r2.g * weight);
  const b = Math.round(r1.b * (1 - weight) + r2.b * weight);
  return '#' + ((1 << 24) + (r << 16) + (g << 8) + b).toString(16).slice(1);
}

/* =====================================================================
   0.5 屏幕常亮控制 (Wake Lock API)
   ===================================================================== */
let wakeLock = null;
async function requestWakeLock() {
  try {
    if ('wakeLock' in navigator) {
      wakeLock = await navigator.wakeLock.request('screen');
      console.log('屏幕常亮已开启');
    } else {
      console.log('当前浏览器不支持屏幕常亮API');
    }
  } catch (err) {
    console.warn(`屏幕常亮请求失败: ${err.name}, ${err.message}`);
  }
}
function releaseWakeLock() {
  if (wakeLock !== null) {
    wakeLock.release().then(() => {
      wakeLock = null;
      console.log('屏幕常亮已释放');
    });
  }
}
// 页面切回前台时，如果处于全屏状态，重新请求常亮
document.addEventListener('visibilitychange', async () => {
  if (document.visibilityState === 'visible' && document.body.style.overflow === 'hidden') {
    await requestWakeLock();
  }
});

/* =====================================================================
   0.6 自定义主题配色系统
   ===================================================================== */
const PRESETS = [
  { name: '默认蓝', primary: '#3b82f6', secondary: '#60a5fa', bg1: '#e9f1fd', bg2: '#f8fbff' },
  { name: '柠檬舒芙蕾', primary: '#dca378', secondary: '#d3e086', bg1: '#ebeccc', bg2: '#fff0b3' },
  { name: '蜜桃乳酪糕', primary: '#af7351', secondary: '#fdc0c5', bg1: '#d2eef2', bg2: '#feecaa' },
  { name: '树莓荔枝卷', primary: '#f9879a', secondary: '#d9c7ef', bg1: '#cbf1f7', bg2: '#ffe48f' },
  { name: '茉莉蜜豆奶', primary: '#da6483', secondary: '#dcc1e0', bg1: '#faf4aa', bg2: '#f7d68d' },
  { name: '鲷鱼烧日落', primary: '#ea7878', secondary: '#ffc840', bg1: '#fff385', bg2: '#fcf0a7' },
  { name: '莓酱芝士挞', primary: '#ffb6bd', secondary: '#afdcf1', bg1: '#ffeeb6', bg2: '#ffd7d5' },
  { name: '雏菊冰糖梨', primary: '#63d6c5', secondary: '#9dc847', bg1: '#bbeadb', bg2: '#f9eea0' },
  { name: '法式蜜桃派', primary: '#f28695', secondary: '#ffd0a9', bg1: '#fce7ae', bg2: '#ffc5bb' },
  { name: '苹果酿酒', primary: '#893619', secondary: '#B8D87F', bg1: '#BEE0C0', bg2: '#ffffff' }
];

function getSavedTheme() { return store.get(K_THEME_COLOR, null); }

function updateCustomThemeCSS() {
  const theme = getSavedTheme();
  const styleEl = $('#custom-theme-style');
  if (!theme) { styleEl.textContent = ''; return; }
  
  const isDark = document.body.classList.contains('dark');
  let p = theme.primary, s = theme.secondary, b1 = theme.bg1, b2 = theme.bg2;
  
  // 夜间模式色彩计算
  if (isDark) {
    b1 = mixColors(theme.primary, '#070e18', 0.85);
    b2 = mixColors(theme.secondary, '#0c1826', 0.9);
    p = mixColors(theme.primary, '#ffffff', 0.25); 
    s = mixColors(theme.secondary, '#ffffff', 0.25);
  }
  
  styleEl.textContent = `
    body, body[data-mode="time"], body[data-mode="pomo"], body[data-mode="sched"], body[data-mode="exam"] {
      --accent: ${p} !important;
      --accent2: ${s} !important;
      --bg1: ${b1} !important;
      --bg2: ${b2} !important;
    }
  `;
}

function applyThemeColor(theme, save = true) {
  if (save) {
    if (theme && theme.name === '恢复默认') {
      store.remove(K_THEME_COLOR);
    } else {
      store.set(K_THEME_COLOR, theme);
    }
  }
  updateCustomThemeCSS();
  if (document.body.dataset.mode === 'pomo') drawPie();
  if (_lastAnalysisIds && $('#examAnalysisPanel').style.display !== 'none') {
    requestAnimationFrame(() => runAnalysis(_lastAnalysisIds));
  }
}

function openThemeModal() {
  const current = getSavedTheme() || PRESETS[0];
  
  let presetHtml = PRESETS.map((p, i) => {
    const isActive = current.primary === p.primary && current.bg1 === p.bg1;
    return `
      <div class="theme-card ${isActive ? 'active' : ''}" onclick="selectThemePreset(${i})">
        <div class="theme-colors">
          <div style="background:${p.primary}"></div>
          <div style="background:${p.secondary}"></div>
          <div style="background:${p.bg1}"></div>
          <div style="background:${p.bg2}"></div>
        </div>
        <div class="theme-name">${p.name}</div>
      </div>
    `;
  }).join('');

  openModal(`
    <h3>🎨 主题配色</h3>
    <div class="theme-picker-grid">
      <div class="theme-card ${!getSavedTheme() ? 'active' : ''}" onclick="applyThemeColor({name:'恢复默认'}, true); closeModal()">
        <div class="theme-colors">
          <div style="background:#3b82f6"></div>
          <div style="background:#60a5fa"></div>
          <div style="background:#e9f1fd"></div>
          <div style="background:#f8fbff"></div>
        </div>
        <div class="theme-name">恢复默认</div>
      </div>
      ${presetHtml}
    </div>

    <div class="muted" style="margin-bottom:10px;">自定义配色（拖动颜色调整）：</div>
    <div class="custom-theme-editor">
      <label class="color-field">主色 <input type="color" id="cpPrimary" value="${current.primary}"></label>
      <label class="color-field">辅色 <input type="color" id="cpSecondary" value="${current.secondary}"></label>
      <label class="color-field">背景1 <input type="color" id="cpBg1" value="${current.bg1}"></label>
      <label class="color-field">背景2 <input type="color" id="cpBg2" value="${current.bg2}"></label>
    </div>

function getLast7DaysData() {
  const now = Date.now(), from = now - 7 * 864e5; const map = new Map();
  records.forEach(r => { if (r.ts < from || r.ts > now) return; map.set(r.name, (map.get(r.name) || 0) + r.durationMs); });
  let arr = [...map.entries()].map(([name, ms]) => ({ name, ms })).sort((a, b) => b.ms - a.ms);
  if (arr.length > 6) { const otherMs = arr.slice(6).reduce((s, x) => s + x.ms, 0); arr = arr.slice(0, 6).concat([{ name: '其他', ms: otherMs }]); } return arr;
}

  if (!data.length || total <= 0) {

    legend.innerHTML = '<div class="empty">开始一次专注，这里就会长出你的饼图啦 🍅</div>'; return;
  }
  const cx = W/2, cy = H/2, rOut = 108, rIn = 66;
  if (data.length === 1) { ctx.beginPath(); ctx.arc(cx, cy, rOut, 0, Math.PI * 2); ctx.moveTo(cx + rIn, cy); ctx.arc(cx, cy, rIn, 0, Math.PI * 2); ctx.fillStyle = PALETTE[0]; ctx.fill('evenodd'); }
  else {
    let a0 = -Math.PI / 2;
    data.forEach((d, i) => {
      const a1 = a0 + (d.ms / total) * Math.PI * 2; ctx.beginPath(); ctx.arc(cx, cy, rOut, a0, a1); ctx.arc(cx, cy, rIn, a1, a0, true); ctx.closePath(); ctx.fillStyle = PALETTE[i % PALETTE.length]; ctx.fill(); a0 = a1;
    });
  }
  ctx.fillStyle = cssColor('--muted', '#6d7b8e'); ctx.font = '700 12px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText('近 7 天', cx, cy - 13);
  ctx.fillStyle = cssColor('--text', '#1b2432'); ctx.font = '800 17px sans-serif'; ctx.fillText(fmtMS(total), cx, cy + 11);
  legend.innerHTML = data.map((d, i) => { const pct = (d.ms / total * 100).toFixed(1); return `<div class="legend-item"><span class="legend-dot" style="background:${PALETTE[i % PALETTE.length]}"></span><span class="legend-name" title="${escAttr(d.name)}">${escHtml(d.name)}</span><span class="legend-val">${pct}% · ${fmtMS(d.ms)}</span></div>`; }).join('');
}

let currentCalYear = new Date().getFullYear(); let currentCalMonth = new Date().getMonth();
function renderCalendar() {
  const grid = $('#calGrid'); const title = $('#calTitle'); title.textContent = `${currentCalYear}年${currentCalMonth + 1}月`;
  const firstDay = new Date(currentCalYear, currentCalMonth, 1).getDay(); const daysInMonth = new Date(currentCalYear, currentCalMonth + 1, 0).getDate();
  const prevDays = new Date(currentCalYear, currentCalMonth, 0).getDate();
  let html = ''; const weekdays = ['日', '一', '二', '三', '四', '五', '六'];
  weekdays.forEach(w => { html += `<div class="cal-weekday">${w}</div>`; });
  for (let i = 0; i < firstDay; i++) { html += `<div class="cal-day other-month">${prevDays - firstDay + i + 1}</div>`; }
  for (let i = 1; i <= daysInMonth; i++) {
    const dStr = `${currentCalYear}-${pad2(currentCalMonth + 1)}-${pad2(i)}`; const isToday = dStr === TODAY_STR;
    html += `<div class="cal-day ${isToday ? 'today' : ''}" data-date="${dStr}">${i}<div class="cal-dot" id="dot-${dStr}"></div></div>`;
  }
  const totalCells = firstDay + daysInMonth; const nextDays = 42 - totalCells;
  for (let i = 1; i <= nextDays; i++) { html += `<div class="cal-day other-month">${i}</div>`; }
  grid.innerHTML = html; updateCalendarDots();
}
function updateCalendarDots() {
  $$('.cal-day[data-date]').forEach(el => {
    const dStr = el.dataset.date; const dot = el.querySelector('.cal-dot'); if (!dot) return;
    const dateCol = schedData.cols.find(c => c.date === dStr); if (!dateCol) { dot.className = 'cal-dot'; return; }
    let total = 0, done = 0, undone = 0;
    schedData.rows.forEach(r => { if (r.cells[dateCol.id] !== undefined) { total++; if (r.cells[dateCol.id] === 1) done++; if (r.cells[dateCol.id] === 2) undone++; } });
    if (total === 0) dot.className = 'cal-dot';
    else if (done === total) dot.className = 'cal-dot dot-green';
    else if (undone > 0) dot.className = 'cal-dot dot-red';
    else dot.className = 'cal-dot dot-yellow';
  });
}

      <td>${escHtml(r.year)}</td>
      <td><a href="javascript:void(0)" onclick="openExamModal('${r.id}')">${escHtml(r.paper)}</a></td>
      <td>${escHtml(r.total)}</td>
      ${rateHtml}
      <td class="op-cell">
        <button class="ghost mini" onclick="openExamModal('${r.id}')">编辑</button>
        <button class="ghost mini danger" onclick="delExam('${r.id}')">删除</button>
      </td>
    </tr>`;
  }).join('');
}

window.delExam = function(id) {
  if (!confirm('确定删除此条成绩吗？')) return;
  examData = examData.filter(r => r.id !== id);
  saveExam(); renderExamTable();
};

window.openExamModal = function(id) {
  const isEdit = !!id;
  const row = isEdit ? examData.find(r => r.id === id) : { id: uid(), year: new Date().getFullYear().toString(), paper: '', total: '', t1_w:'', t1_t:'', t2_w:'', t2_t:'', t3_w:'', t3_t:'', t4_w:'', t4_t:'', t5_w:'', t5_t:'', t6_w:'', t6_t:'' };

  openModal(`
    <h3>${isEdit ? '✏️ 修改成绩' : '➕ 录入成绩'}</h3>
    <div style="display:grid; grid-template-columns: 1fr 1fr 1fr; gap:10px; margin-bottom:15px;">
      <label class="field"><span>年份</span><input type="text" id="eYear" value="${escAttr(row.year)}" placeholder="2024"></label>
      <label class="field" style="grid-column: span 2;"><span>试卷名称</span><input type="text" id="ePaper" value="${escAttr(row.paper)}" placeholder="国考/省考/模拟卷"></label>
    </div>
    <label class="field" style="margin-bottom:15px;"><span>试卷总分</span><input type="number" id="eTotal" value="${escAttr(row.total)}" placeholder="例如 75"></label>

    <div style="margin-top:15px; border-top:1px dashed var(--card-border); padding-top:15px;">
      <p class="muted" style="margin-bottom:10px;">请输入每个模块的错题数和总题数，系统自动计算正确率：</p>
      ${MODULES.map((m, i) => {
        const k = 't' + (i+1);
        return `<div style="display:grid; grid-template-columns: 80px 1fr 1fr; gap:10px; align-items:center; margin-bottom:8px;">
          <span style="font-size:14px; font-weight:600;">${m}</span>
          <label class="field" style="flex-direction:row; align-items:center; gap:5px; margin:0;"><span style="font-size:12px;">错题</span><input type="number" id="eW_${i+1}" value="${escAttr(row[k+'_w'] || '')}" style="min-height:36px; padding:6px;"></label>
          <label class="field" style="flex-direction:row; align-items:center; gap:5px; margin:0;"><span style="font-size:12px;">总题</span><input type="number" id="eT_${i+1}" value="${escAttr(row[k+'_t'] || '')}" style="min-height:36px; padding:6px;"></label>
        </div>`;
      }).join('')}
    </div>
    <div class="modal-actions">
      <button class="ghost" id="eCancel">取消</button>
      <button class="primary" id="eSave">保存</button>
    </div>
  `, (box, close) => {
    box.querySelector('#eCancel').onclick = close;
    box.querySelector('#eSave').onclick = () => {
      const year = box.querySelector('#eYear').value.trim() || '2024';
      const paper = box.querySelector('#ePaper').value.trim() || '未命名试卷';
      const total = parseFloat(box.querySelector('#eTotal').value) || 0;

      const newRow = { id: row.id, year, paper, total };
      MODULES.forEach((m, i) => {
        const w = parseFloat(box.querySelector(`#eW_${i+1}`).value) || 0;
        const t = parseFloat(box.querySelector(`#eT_${i+1}`).value) || 0;
        newRow[`t${i+1}_w`] = w;
        newRow[`t${i+1}_t`] = t;
      });

      if (isEdit) {
        const idx = examData.findIndex(r => r.id === id);
        examData[idx] = newRow;
      } else {
        examData.push(newRow);
      }
      saveExam(); renderExamTable(); close(); toast('保存成功 📊');
    };
  });
};

$('#btnAddExamRow').addEventListener('click', () => openExamModal(null));
$('#btnClearExam').addEventListener('click', () => { if (!confirm('确定清空所有成绩记录吗？')) return; examData = []; saveExam(); renderExamTable(); $('#examAnalysisPanel').style.display = 'none'; _lastAnalysisIds = null; });

/* --- 数据分析 --- */
$('#btnAnalyzeExam').addEventListener('click', () => {
  if (examData.length < 1) { toast('请至少录入一条成绩记录'); return; }
  openModal(`
    <h3>📊 选择要分析的试卷</h3>
    <div style="max-height:250px; overflow-y:auto; margin-bottom:15px;">
      ${examData.map(r => `<label class="radio-chip" style="display:flex; margin-bottom:8px;"><input type="checkbox" class="exam-check" value="${r.id}" checked> ${escHtml(r.year)} - ${escHtml(r.paper)}</label>`).join('')}
    </div>
    <div class="modal-actions"><button class="ghost" id="anaCancel">取消</button><button class="primary" id="anaConfirm">开始分析</button></div>
  `, (box, close) => {
    box.querySelector('#anaCancel').onclick = close;
    box.querySelector('#anaConfirm').onclick = () => {
      const selectedIds = Array.from(box.querySelectorAll('.exam-check:checked')).map(cb => cb.value);
      if (!selectedIds.length) { toast('请至少选择一场考试'); return; }
      close();
      runAnalysis(selectedIds);
    };
  });
});

function runAnalysis(ids) {
  _lastAnalysisIds = ids.slice();
  const selected = examData.filter(r => ids.includes(r.id)).sort((a,b) => a.year.localeCompare(b.year) || a.paper.localeCompare(b.paper));
  const panel = $('#examAnalysisPanel'); panel.style.display = 'block';

  const labels = selected.map(r => `${r.year} ${r.paper.slice(0,4)}`);
  const scores = selected.map(r => parseFloat(r.total) || 0);

  drawExamChart(labels, scores);

  let weakModule = ''; let minRate = 1;
  let textHtml = `<p>本次分析了 <b>${selected.length}</b> 套试卷。</p>`;

  const moduleStats = MODULE_KEYS.map((k, i) => {
    let totalQ = 0; let totalW = 0;
    selected.forEach(r => { totalQ += (parseFloat(r[k + '_t']) || 0); totalW += (parseFloat(r[k + '_w']) || 0); });
    const rate = totalQ > 0 ? (totalQ - totalW) / totalQ : 0;
    if (rate < minRate && totalQ > 0) { minRate = rate; weakModule = MODULES[i]; }
    return { name: MODULES[i], rate, totalQ };
  }).filter(m => m.totalQ > 0);

  if (weakModule) {
    textHtml += `<p>🎯 <b>最薄弱模块：</b>综合分析，你在 <b style="color:#ef4444">${weakModule}</b> 模块的正确率相对较低（约 ${(minRate*100).toFixed(1)}%），建议接下来重点刷该模块的专项题。</p>`;
  } else {
    textHtml += `<p>🎯 录入的数据缺少各模块的详细答题数，无法进行薄弱点分析。</p>`;
  }

  const trends = [];
  MODULE_KEYS.forEach((k, i) => {
    if (selected.length < 2) return;
    const half = Math.floor(selected.length / 2);
    const p1 = selected.slice(0, half); const p2 = selected.slice(half);
    const getRate = arr => {
      let tq = 0, tw = 0; arr.forEach(r => { tq += (parseFloat(r[k+'_t'])||0); tw += (parseFloat(r[k+'_w'])||0); }); return tq ? (tq - tw)/tq : 0;
    };
    const r1 = getRate(p1); const r2 = getRate(p2);
    if (r1 > 0 && r2 > 0) trends.push({ name: MODULES[i], diff: r2 - r1, r1, r2 });
  });
  trends.sort((a, b) => b.diff - a.diff);
  if (trends.length) {
    textHtml += `<p>📈 <b>趋势分析：</b><br>`;
    trends.forEach(t => {
      if (t.diff > 0.03) textHtml += `　- ${t.name}：正确率上升 <b style="color:#22c55e">▲ ${(t.diff*100).toFixed(1)}%</b>，进步明显，继续保持！<br>`;
      else if (t.diff < -0.03) textHtml += `　- ${t.name}：正确率下降 <b style="color:#ef4444">▼ ${(Math.abs(t.diff)*100).toFixed(1)}%</b>，需要多加练习找回手感。<br>`;
      else textHtml += `　- ${t.name}：表现平稳，建议突破瓶颈。<br>`;
    });
    textHtml += `</p>`;
  }
  $('#examAnalysisText').innerHTML = textHtml;
  panel.scrollIntoView({ behavior: 'smooth' });
}

function drawExamChart(labels, scores) {
  const cv = $('#examChart'); const ctx = cv.getContext('2d');
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const rect = cv.parentElement.getBoundingClientRect();
  cv.width = rect.width * dpr; cv.height = rect.height * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  const W = rect.width, H = rect.height;
  ctx.clearRect(0, 0, W, H);

  if (!scores.length) return;

  const C = {
    muted: cssColor('--muted', '#6d7b8e'),
    accent: cssColor('--accent', '#8b5cf6'),
    text: cssColor('--text', '#1b2432'),
    card: cssColor('--card-solid', '#ffffff')
  };

  const padding = { top: 20, right: 20, bottom: 40, left: 40 };
  const chartW = W - padding.left - padding.right;
  const chartH = H - padding.top - padding.bottom;

  const maxScore = Math.max(...scores, 100);
  const yScale = chartH / maxScore;

  ctx.strokeStyle = 'rgba(130,150,190,.2)'; ctx.lineWidth = 1;
  for (let i = 0; i <= 4; i++) {
    const y = padding.top + chartH - (i * chartH / 4);
    ctx.beginPath(); ctx.moveTo(padding.left, y); ctx.lineTo(W - padding.right, y); ctx.stroke();
    ctx.fillStyle = C.muted; ctx.font = '12px sans-serif'; ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
    ctx.fillText(Math.round(i * maxScore / 4), padding.left - 8, y);
  }

  const stepX = chartW / Math.max(1, scores.length - 1);
  const points = scores.map((s, i) => ({ x: padding.left + i * stepX, y: padding.top + chartH - s * yScale }));

  ctx.beginPath(); ctx.strokeStyle = C.accent; ctx.lineWidth = 3; ctx.lineJoin = 'round';
  points.forEach((p, i) => { if (i === 0) ctx.moveTo(p.x, p.y); else ctx.lineTo(p.x, p.y); });
  ctx.stroke();

  ctx.lineTo(points[points.length-1].x, padding.top + chartH);
  ctx.lineTo(points[0].x, padding.top + chartH);
  ctx.closePath();
  const grad = ctx.createLinearGradient(0, padding.top, 0, padding.top + chartH);
  grad.addColorStop(0, 'rgba(139,92,246,0.3)'); grad.addColorStop(1, 'rgba(139,92,246,0.01)');
  ctx.fillStyle = grad; ctx.fill();

  points.forEach((p, i) => {
    ctx.beginPath(); ctx.arc(p.x, p.y, 5, 0, Math.PI * 2); ctx.fillStyle = C.card; ctx.fill(); ctx.strokeStyle = C.accent; ctx.lineWidth = 3; ctx.stroke();
    ctx.fillStyle = C.muted; ctx.font = '12px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'top';
    ctx.fillText(labels[i], p.x, padding.top + chartH + 10);
    ctx.fillStyle = C.text; ctx.font = 'bold 12px sans-serif'; ctx.textBaseline = 'bottom';
    ctx.fillText(scores[i], p.x, p.y - 8);
  });
}

/* =====================================================================
   8. 全局初始化 & 绑定
   ===================================================================== */
function applyTheme(dark) {
  document.body.classList.toggle('dark', dark);
  $('#themeIcon').textContent = dark ? '☀️' : '🌙';
  store.set(K_THEME, dark);
  updateCustomThemeCSS(); // 更新自定义颜色的深色适配
  if (document.body.dataset.mode === 'pomo') drawPie();
  if (_lastAnalysisIds && $('#examAnalysisPanel').style.display !== 'none') {
    requestAnimationFrame(() => runAnalysis(_lastAnalysisIds));
  }
}
function switchMode(mode) {
  if (!['time', 'pomo', 'sched', 'exam'].includes(mode)) mode = 'time';
  document.body.dataset.mode = mode;
  $$('.tabs button').forEach(b => b.classList.toggle('active', b.dataset.mode === mode));
  $$('.view').forEach(v => v.classList.toggle('active', v.id === 'view-' + mode));
  store.set(K_MODE, mode);
  if (mode === 'pomo') { tickTimer(); renderRecords(); drawPie(); }
  if (mode === 'sched') renderSched();
  if (mode === 'exam') renderExamTable();
}
function toggleFullscreen() {
  const doc = window.document; const el = doc.documentElement;
  if (!doc.fullscreenElement && !doc.webkitFullscreenElement) { if (el.requestFullscreen) el.requestFullscreen().catch(()=>{}); else if (el.webkitRequestFullscreen) el.webkitRequestFullscreen(); }
  else { if (doc.exitFullscreen) doc.exitFullscreen().catch(()=>{}); else if (doc.webkitExitFullscreen) doc.webkitExitFullscreen(); }
}

function bindEvents() {
  $$('.tabs button').forEach(btn => btn.addEventListener('click', () => switchMode(btn.dataset.mode)));
  $('#btnTheme').addEventListener('click', () => applyTheme(!document.body.classList.contains('dark')));
  $('#btnFullscreen').addEventListener('click', toggleFullscreen);
  $('#btnFlipMode').addEventListener('click', toggleFlipClock); $('#flipCloseBtn').addEventListener('click', toggleFlipClock);

  $('#segCountdown').addEventListener('click', () => setTimerMode('countdown'));
  $('#segCountup').addEventListener('click', () => setTimerMode('countup'));
  $('#btnStartPause').addEventListener('click', toggleTimer); $('#btnReset').addEventListener('click', resetTimer); $('#btnFinish').addEventListener('click', handleFinish);
  $('#btnApplySet').addEventListener('click', applyMinutes); $('#setMinutes').addEventListener('keydown', e => { if (e.key === 'Enter') applyMinutes(); });
  $('#weekSelect').addEventListener('change', renderRecords); $('#btnExportCSV').addEventListener('click', exportCSV);

  document.addEventListener('keydown', e => {
    if (e.code !== 'Space') return; if (document.body.dataset.mode !== 'pomo') return;
    const tag = (e.target.tagName || '').toLowerCase(); if (['input', 'textarea', 'select', 'button'].includes(tag)) return;
    if (e.target.isContentEditable || $('#modalRoot').classList.contains('show')) return;
    e.preventDefault(); toggleTimer();
  });
  document.addEventListener('visibilitychange', () => { if (!document.hidden) { tickClock(); tickTimer(); if (document.body.dataset.mode === 'pomo') drawPie(); } });
  window.addEventListener('resize', () => {
    if (document.body.dataset.mode === 'pomo') drawPie();
    if (_lastAnalysisIds && $('#examAnalysisPanel').style.display !== 'none') {
      const cv = $('#examChart'); if (cv) {
        const r = cv.parentElement.getBoundingClientRect();
        if (r.width > 0) runAnalysis(_lastAnalysisIds);
      }
    }
  });
  window.addEventListener('beforeunload', () => {
    clearTimeout(schedSaveTimer);
    try {
      const str = JSON.stringify(schedData);
      if (str.length <= 4.2 * 1024 * 1024) localStorage.setItem(K_SCHED, str);
    } catch (e) { console.error(e); }
  });
}

function init() {
  applyTheme(store.get(K_THEME, false));
  loadTimer(); updateStartBtn(); tickTimer();
  const mins = Math.round(timer.totalMs / 60000); const setEl = $('#setMinutes'); if (setEl) setEl.value = mins > 0 ? mins : 25;
  setTimerMode(timer.mode);
  tickClock(); renderRecords(); drawPie(); renderSched(); renderExamTable();
  switchMode(store.get(K_MODE, 'time'));
  bindEvents();
  setInterval(tickClock, 1000); setInterval(tickTimer, 100);
}
document.addEventListener('DOMContentLoaded', init);
</script>
