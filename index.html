<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>番茄钟 · 学习工作台</title>
<style>
/* ============ 基础变量 ============ */
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
:root{
  --radius:18px;
  --card-bg:rgba(255,255,255,.78);
  --card-solid:#ffffff;
  --card-border:rgba(120,150,200,.24);
  --text:#1b2432;
  --muted:#6d7b8e;
  --bg1:#e9f1fd;
  --bg2:#f8fbff;
  --accent:#3b82f6;
  --accent2:#60a5fa;
  --shadow:0 10px 32px rgba(60,90,140,.13);
}
body.dark{
  --card-bg:rgba(16,30,48,.76);
  --card-solid:#101f31;
  --card-border:rgba(90,180,230,.22);
  --text:#dcecfb;
  --muted:#8aa6c2;
  --bg1:#070e18;
  --bg2:#0c1826;
  --shadow:0 10px 34px rgba(0,20,40,.55);
}
body[data-mode="time"]{--accent:#17a89a;--accent2:#4dd6c4;}
body[data-mode="pomo"]{--accent:#e2603f;--accent2:#ff9a72;}
body[data-mode="acc"] {--accent:#7c5cff;--accent2:#a98bff;}
body.dark[data-mode="time"]{--accent:#2fd0d8;--accent2:#8bf5ec;}
body.dark[data-mode="pomo"]{--accent:#38b6ee;--accent2:#8ad9ff;}
body.dark[data-mode="acc"] {--accent:#6f8dff;--accent2:#a9c0ff;}

html,body{height:100%;}
body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  color:var(--text);
  background:linear-gradient(160deg,var(--bg1) 0%,var(--bg2) 100%);
  background-attachment:fixed;
  transition:background .6s ease,color .4s ease;
  overflow-x:hidden;
  -webkit-text-size-adjust:100%;
  text-size-adjust:100%;
  touch-action:manipulation;
}

/* ============ 背景漂浮图 ============ */
#bgLayer{position:fixed;inset:0;overflow:hidden;z-index:0;pointer-events:none;}
.float-img{
  position:absolute;
  background-size:cover;background-position:center;
  border-radius:24px;opacity:.16;
  filter:blur(.5px) saturate(.85);
  animation-name:drift;
  animation-timing-function:ease-in-out;
  animation-iteration-count:infinite;
  will-change:transform;
}
body.dark .float-img{opacity:.10;}
@keyframes drift{
  0%  {transform:translate(0,0) rotate(0deg) scale(1);}
  25% {transform:translate(var(--dx1),var(--dy1)) rotate(var(--rot)) scale(1.06);}
  50% {transform:translate(var(--dx2),var(--dy2)) rotate(calc(var(--rot) * -1)) scale(.95);}
  75% {transform:translate(var(--dx3),var(--dy3)) rotate(var(--rot)) scale(1.03);}
  100%{transform:translate(0,0) rotate(0deg) scale(1);}
}

/* ============ 头部 ============ */
header{
  position:fixed;top:0;left:0;right:0;z-index:40;
  min-height:72px;
  display:grid;grid-template-columns:1fr auto 1fr;align-items:center;
  gap:10px;padding:0 16px;
  padding-top:env(safe-area-inset-top);
}
.tabs{
  grid-column:2;display:flex;gap:6px;padding:6px;border-radius:999px;
  background:var(--card-bg);border:1px solid var(--card-border);
  -webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);
  box-shadow:var(--shadow);
}
.tabs button{
  border:none;background:transparent;color:var(--muted);
  padding:10px 22px;border-radius:999px;font-size:15px;font-weight:700;
  cursor:pointer;transition:all .25s;font-family:inherit;white-space:nowrap;
  touch-action:manipulation;
}
.tabs button.active{
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  color:#fff;box-shadow:0 6px 18px rgba(0,0,0,.18);
}
.top-right{grid-column:3;justify-self:end;display:flex;gap:8px;}
.icon-btn{
  border:1px solid var(--card-border);background:var(--card-bg);
  color:var(--text);
  -webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);
  padding:10px 15px;border-radius:12px;font-size:14px;font-weight:600;
  cursor:pointer;transition:.22s;font-family:inherit;box-shadow:var(--shadow);
  display:flex;align-items:center;gap:6px;min-height:44px;
  touch-action:manipulation;
}
.icon-btn:hover{border-color:var(--accent);color:var(--accent);}

/* ============ 主体 ============ */
main{position:relative;z-index:10;padding:92px 18px 70px;max-width:1180px;margin:0 auto;}
.view{display:none;}
.view.active{display:block;animation:fadeUp .35s ease;}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px);}to{opacity:1;transform:none;}}

/* ============ 时间模式 ============ */
#view-time.active{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  min-height:calc(100vh - 170px);
  min-height:calc(100dvh - 170px);
}
.clock-tools { display: flex; gap: 10px; margin-bottom: 20px; }

#bigClock{
  display:flex;align-items:baseline;justify-content:center;
  font-size:clamp(58px,14vw,180px);
  font-weight:800;letter-spacing:.02em;line-height:1;
  font-variant-numeric:tabular-nums;
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  -webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 10px 26px rgba(0,0,0,.13));
  user-select:none;-webkit-user-select:none;
}
#clockS{font-size:.28em;opacity:.55;margin-left:.14em;font-weight:700;}
#bigDate{
  margin-top:20px;font-size:clamp(14px,2vw,21px);
  color:var(--muted);letter-spacing:.1em;font-weight:600;text-align:center;
}
.time-tip{margin-top:36px;color:var(--muted);font-size:13px;opacity:.75;letter-spacing:.06em;text-align:center;}

/* ============ 卡片 ============ */
.card{
  background:var(--card-bg);border:1px solid var(--card-border);
  border-radius:var(--radius);padding:22px;margin-bottom:20px;
  box-shadow:var(--shadow);
  -webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);
  transition:background .4s,border-color .4s;
}
.card-head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:16px;}
.card-head h3{margin:0;font-size:16px;font-weight:700;letter-spacing:.02em;}
.head-tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap;}

/* ============ 按钮 / 输入 ============ */
button{font-family:inherit;}
.primary{
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  color:#fff;border:none;padding:12px 22px;border-radius:12px;
  font-weight:700;font-size:14px;cursor:pointer;transition:.22s;
  box-shadow:0 6px 18px rgba(0,0,0,.14);
  min-height:44px;touch-action:manipulation;
}
.primary:hover{filter:brightness(1.08);}
.primary:active{transform:scale(.98);}
.ghost{
  background:transparent;border:1px solid var(--card-border);color:var(--text);
  padding:11px 18px;border-radius:12px;font-weight:600;font-size:14px;
  cursor:pointer;transition:.22s;min-height:44px;touch-action:manipulation;
}
.ghost:hover{border-color:var(--accent);color:var(--accent);}
.ghost.danger:hover{border-color:#ef4444;color:#ef4444;}
.ghost:active{transform:scale(.98);}
.mini{padding:7px 13px;font-size:12.5px;border-radius:9px;min-height:36px;}
.big{padding:14px 34px;font-size:15px;}

input[type=number],input[type=text],select,textarea{
  background:rgba(255,255,255,.66);
  border:1px solid var(--card-border);color:var(--text);
  border-radius:11px;padding:11px 13px;font-size:16px;font-family:inherit;
  outline:none;transition:.22s;width:100%;min-height:44px;
}
body.dark input[type=number],body.dark input[type=text],
body.dark select,body.dark textarea{background:rgba(255,255,255,.06);}
input:focus,select:focus,textarea:focus{
  border-color:var(--accent);box-shadow:0 0 0 3px rgba(80,140,255,.16);
}
textarea{resize:vertical;min-height:78px;}
input[type=checkbox]{width:20px;height:20px;accent-color:var(--accent);cursor:pointer;}
label.field{display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--muted);font-weight:600;}
label.field span{letter-spacing:.02em;}

/* ============ 番茄钟 ============ */
.timer-card{text-align:center;max-width:800px;margin-left:auto;margin-right:auto;}
.seg{
  display:inline-flex;gap:4px;padding:4px;border-radius:999px;
  background:rgba(130,150,190,.14);margin-bottom:14px;
}
.seg button{
  border:none;background:transparent;color:var(--muted);
  padding:9px 26px;border-radius:999px;font-size:14px;font-weight:700;
  cursor:pointer;transition:.22s;min-height:40px;
}
.seg button.active{background:var(--card-solid);color:var(--accent);box-shadow:0 3px 10px rgba(0,0,0,.1);}
body.dark .seg button.active{background:rgba(255,255,255,.1);}

.timer-display{
  font-size:clamp(52px,11vw,120px);
  font-weight:800;line-height:1.05;letter-spacing:.02em;
  font-variant-numeric:tabular-nums;
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  -webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 8px 22px rgba(0,0,0,.12));
  user-select:none;-webkit-user-select:none;margin:6px 0 14px;
}
.set-row{display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap;margin-bottom:18px;}
.set-row label{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);font-weight:600;flex-wrap:wrap;}
.set-row input{width:110px;text-align:center;}
.hint{font-size:12px;color:var(--muted);opacity:.85;background:rgba(130,150,190,.12);padding:7px 12px;border-radius:9px;}
.ctrl-row{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;}
.progress{height:6px;border-radius:99px;background:rgba(130,150,190,.18);margin-top:22px;overflow:hidden;}
#progressBar{height:100%;width:0%;border-radius:99px;background:linear-gradient(90deg,var(--accent),var(--accent2));transition:width .12s linear;}

/* ============ 表格 ============ */
.table-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;}
table{width:100%;border-collapse:collapse;font-size:14px;}
th,td{padding:11px 12px;text-align:left;border-bottom:1px solid var(--card-border);white-space:nowrap;}
th{color:var(--muted);font-weight:700;font-size:12.5px;letter-spacing:.04em;}
tbody tr{transition:background .18s;}
tbody tr:hover{background:rgba(120,160,220,.09);}
td.op-cell{white-space:nowrap;}
td.op-cell button{margin-right:6px;}
td.op-cell button:last-child{margin-right:0;}
.empty{text-align:center;color:var(--muted);padding:26px 0;font-size:14px;white-space:normal;}
.chip{display:inline-block;padding:3px 10px;border-radius:99px;font-size:12px;font-weight:700;}
.chip.pos{background:rgba(34,197,94,.15);color:#16a34a;}
.chip.neg{background:rgba(239,68,68,.15);color:#dc2626;}
body.dark .chip.pos{color:#4ade80;}
body.dark .chip.neg{color:#f87171;}

/* ============ 正确率 ============ */
.acc-good{color:#16a34a;font-weight:800;}
.acc-mid {color:#2563eb;font-weight:800;}
.acc-low {color:#ea8c00;font-weight:800;}
.acc-bad {color:#dc2626;font-weight:800;}
body.dark .acc-good{color:#4ade80;}
body.dark .acc-mid {color:#60a5fa;}
body.dark .acc-low {color:#fbbf24;}
body.dark .acc-bad {color:#f87171;}

.form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px;margin-bottom:16px;align-items:end;}
.acc-live-box{
  display:flex;flex-direction:column;gap:4px;
  border:1px dashed var(--card-border);border-radius:12px;padding:8px 14px;
  background:rgba(130,150,190,.08);min-height:44px;justify-content:center;
}
.acc-live-box .label{font-size:12px;color:var(--muted);font-weight:700;}
.acc-live{font-size:26px;font-weight:800;line-height:1.1;}
.gen-box{display:flex;align-items:flex-end;}

.analysis-box{
  margin-top:16px;padding:16px 18px;border-radius:14px;
  background:rgba(130,150,190,.09);border:1px dashed var(--card-border);
  font-size:14px;line-height:1.9;
}
.analysis-box h4{margin:0 0 8px;font-size:14px;letter-spacing:.03em;}
.analysis-box .cheer{margin-top:10px;font-size:13.5px;color:var(--accent);font-weight:700;}
.tag{display:inline-block;padding:2px 9px;border-radius:8px;background:rgba(130,150,190,.18);font-size:12.5px;font-weight:700;margin:0 2px;}
.arrow-up{color:#16a34a;font-weight:800;}
.arrow-down{color:#dc2626;font-weight:800;}

/* ============ 饼图 ============ */
.pie-wrap{display:flex;flex-wrap:wrap;gap:22px;align-items:center;justify-content:center;}
#pieChart{width:260px;height:260px;flex:0 0 auto;}
#pieLegend{flex:1 1 220px;min-width:190px;display:flex;flex-direction:column;gap:9px;max-height:280px;overflow-y:auto;}
.legend-item{display:flex;align-items:center;gap:9px;font-size:13.5px;}
.legend-dot{width:11px;height:11px;border-radius:4px;flex:0 0 auto;}
.legend-name{flex:1 1 auto;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.legend-val{color:var(--muted);font-variant-numeric:tabular-nums;font-size:12.5px;flex:0 0 auto;}

/* ============ 抽屉 ============ */
#drawer{
  position:fixed;top:0;right:0;bottom:0;width:min(380px,92vw);
  background:var(--card-solid);border-left:1px solid var(--card-border);
  z-index:90;transform:translateX(102%);
  transition:transform .38s cubic-bezier(.4,0,.2,1);
  display:flex;flex-direction:column;
  box-shadow:-24px 0 60px rgba(0,0,0,.2);
  padding-bottom:env(safe-area-inset-bottom);
}
#drawer.open{transform:translateX(0);}
.drawer-head{
  display:flex;align-items:center;justify-content:space-between;
  padding:18px 20px;border-bottom:1px solid var(--card-border);
  padding-top:calc(18px + env(safe-area-inset-top));
}
.drawer-head h3{margin:0;font-size:16px;}
.drawer-body{padding:16px 20px;overflow-y:auto;flex:1;-webkit-overflow-scrolling:touch;}
.sticky-input{display:flex;flex-direction:column;gap:10px;margin-bottom:18px;}
#stickyList{display:flex;flex-direction:column;gap:12px;}
.sticky-item{
  border-radius:14px;padding:13px 14px;
  background:linear-gradient(160deg,rgba(255,230,120,.34),rgba(255,200,80,.20));
  border:1px solid rgba(220,180,60,.35);animation:fadeUp .25s ease;
}
body.dark .sticky-item{
  background:linear-gradient(160deg,rgba(60,110,160,.30),rgba(40,80,130,.22));
  border-color:rgba(90,180,230,.28);
}
.sticky-text{white-space:pre-wrap;word-break:break-word;font-size:14px;line-height:1.6;}
.sticky-meta{font-size:11.5px;color:var(--muted);margin-top:8px;}
.sticky-ops{display:flex;gap:6px;margin-top:9px;}
.sticky-edit{min-height:70px;font-size:15px;background:rgba(255,255,255,.7);}

/* ============ 弹窗 ============ */
#modalRoot{position:fixed;inset:0;z-index:100;display:none;}
#modalRoot.show{display:block;}
.modal-mask{
  position:absolute;inset:0;background:rgba(8,18,32,.5);
  display:flex;align-items:flex-start;justify-content:center;
  overflow-y:auto;-webkit-overflow-scrolling:touch;
  padding:clamp(16px,9vh,90px) 16px 48px;
  -webkit-backdrop-filter:blur(5px);backdrop-filter:blur(5px);
}
.modal-box{
  width:min(460px,100%);background:var(--card-solid);
  border:1px solid var(--card-border);border-radius:20px;padding:26px;
  box-shadow:0 26px 70px rgba(0,0,0,.35);
  animation:pop .24s cubic-bezier(.3,1.4,.5,1);
  margin:auto 0;
}
@keyframes pop{from{transform:scale(.93);opacity:0;}to{transform:scale(1);opacity:1;}}
.modal-box h3{margin:0 0 10px;font-size:18px;}
.modal-box .muted{color:var(--muted);font-size:13.5px;margin:0 0 16px;}
.modal-box .field{margin-bottom:14px;}
.modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:20px;flex-wrap:wrap;}
.radio-row{display:flex;gap:10px;flex-wrap:wrap;}
.radio-chip{
  display:flex;align-items:center;gap:7px;padding:11px 16px;border-radius:11px;
  border:1px solid var(--card-border);cursor:pointer;font-size:14px;font-weight:600;
  transition:.2s;min-height:44px;
}
.radio-chip:has(input:checked){border-color:var(--accent);color:var(--accent);background:rgba(80,140,255,.09);}
.radio-chip input{accent-color:var(--accent);width:18px;height:18px;}

/* ============ Toast ============ */
#toast{
  position:fixed;left:50%;bottom:42px;transform:translate(-50%,26px);
  background:rgba(20,32,50,.92);color:#fff;
  padding:12px 22px;border-radius:12px;font-size:14px;font-weight:600;
  opacity:0;pointer-events:none;transition:.3s;z-index:200;white-space:nowrap;
  max-width:90vw;overflow:hidden;text-overflow:ellipsis;
}
#toast.show{opacity:1;transform:translate(-50%,0);}

/* ============ 闪烁提醒 ============ */
#flashOverlay{
  position:fixed;inset:0;z-index:60;pointer-events:none;opacity:0;
  background:radial-gradient(circle at 50% 50%,rgba(120,210,255,.55),rgba(120,210,255,.04) 72%);
}
#flashOverlay.on{animation:breathe 1s ease-in-out 5;}
@keyframes breathe{0%,100%{opacity:0;}50%{opacity:1;}}

/* ============ 抖动 ============ */
.shake{animation:shake .5s;border-color:#ef4444 !important;}
@keyframes shake{
  0%,100%{transform:translateX(0);}
  20%{transform:translateX(-7px);}40%{transform:translateX(7px);}
  60%{transform:translateX(-5px);}80%{transform:translateX(5px);}
}

/* ============ 翻页时钟 ============ */
#flipClockOverlay {
  position: fixed; inset: 0; z-index: 999;
  background: #000; color: #fff;
  display: none; flex-direction: column;
  align-items: center; justify-content: center;
  font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
}
#flipClockOverlay.active { display: flex; }
.flip-wrap { display: flex; gap: 10px; align-items: center; transform: scale(1.2); margin-top: -40px; }
.flip-group { display: flex; gap: 6px; }
.flip-card {
  position: relative; width: 90px; height: 130px;
  background: #1a1a1a; border-radius: 12px;
  box-shadow: 0 5px 15px rgba(255,255,255,0.05), inset 0 0 0 1px rgba(255,255,255,0.1);
  display: flex; align-items: center; justify-content: center;
  font-size: 100px; font-weight: bold; color: #fff;
  perspective: 400px;
}
.flip-card::after {
  content: ''; position: absolute; top: 50%; left: 0; width: 100%; height: 1px;
  background: #000; z-index: 2;
}
.flip-colon { font-size: 80px; font-weight: bold; color: #fff; margin: 0 5px; opacity: 0.8; }
.flip-anim { animation: flipDown 0.6s ease-in; }
@keyframes flipDown {
  0% { transform: rotateX(0deg); }
  50% { transform: rotateX(-90deg); background: #333; }
  100% { transform: rotateX(0deg); }
}
#flipDate {
  margin-top: 40px; font-size: 20px; color: #888; font-weight: 500; letter-spacing: 2px;
}
#flipCloseBtn {
  position: absolute; bottom: 40px; background: rgba(255,255,255,0.1);
  color: #fff; border: 1px solid rgba(255,255,255,0.2);
  padding: 10px 30px; border-radius: 30px; font-size: 16px; cursor: pointer;
}

/* ============ 平板 / 手机适配 ============ */
@media (pointer:coarse){
  .only-desktop{display:none;}
  .tabs button{padding:11px 20px;font-size:15px;}
  .primary,.ghost{min-height:48px;}
  .mini{min-height:40px;padding:9px 15px;font-size:13px;}
  .modal-actions button{min-height:48px;}
}
@media (max-width:600px){
  header{min-height:66px;padding:0 10px;gap:6px;}
  .tabs{padding:5px;gap:4px;}
  .tabs button{padding:9px 12px;font-size:13px;}
  .icon-btn{padding:9px 11px;font-size:15px;min-height:42px;}
  .icon-btn .lbl{display:none;}
  main{padding:84px 12px 60px;}
  .card{padding:16px;}
  .timer-display{font-size:clamp(44px,13vw,72px);}
  .seg button{padding:9px 20px;}
  .ctrl-row .primary,.ctrl-row .ghost{flex:1 1 40%;}
  #pieChart{width:220px;height:220px;}
  .modal-box{padding:20px;}
  .flip-wrap { transform: scale(0.8); }
  .flip-card { width: 70px; height: 100px; font-size: 70px; }
  .flip-colon { font-size: 60px; }
}
@media (min-width:900px) and (orientation:landscape){
  main{padding-top:100px;}
}
</style>
</head>
<body data-mode="time">

<div id="bgLayer"></div>
<div id="flashOverlay"></div>

<header>
  <nav class="tabs">
    <button data-mode="time" class="active">🕐 时间</button>
    <button data-mode="pomo">🍅 番茄钟</button>
    <button data-mode="acc">📊 正确率</button>
  </nav>
  <div class="top-right">
    <button class="icon-btn" id="btnFullscreen"><span>⛶</span><span class="lbl">全屏</span></button>
    <button class="icon-btn" id="btnSticky"><span>📝</span><span class="lbl">便利贴</span></button>

<script>
/* =====================================================================
   0. 通用工具
   ===================================================================== */
const $  = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const pad2 = n => String(n).padStart(2, '0');
const uid  = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const escHtml = s => String(s).replace(/[&<>"']/g, c =>
  ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
const escAttr = escHtml;

const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
};

const K_REC = 'tt_records_v1', K_ACC = 'tt_acc_v1', K_TIMER = 'tt_timer_v1',
      K_STICKY = 'tt_sticky_v1', K_THEME = 'tt_theme_v1', K_MODE = 'tt_mode_v1',
      K_LASTPJ = 'tt_last_project';

let _toastTimer = null;
function toast(msg) {
  let t = $('#toast');
  if (!t) { t = document.createElement('div'); t.id = 'toast'; document.body.appendChild(t); }
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(_toastTimer);
  _toastTimer = setTimeout(() => t.classList.remove('show'), 1900);
}

function fmtMS(ms) {
  const total = Math.max(0, Math.round(ms / 1000));
  const h = Math.floor(total / 3600), m = Math.floor((total % 3600) / 60), s = total % 60;
  return h > 0 ? `${pad2(h)}:${pad2(m)}:${pad2(s)}` : `${pad2(m)}:${pad2(s)}`;
}
function fmtDateTime(ts) {
  const d = new Date(ts);
  return `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())} ${pad2(d.getHours())}:${pad2(d.getMinutes())}`;
}
function dateStr(d) { return `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`; }
function mondayOf(ts) {
  const d = new Date(ts); d.setHours(0, 0, 0, 0);
  d.setDate(d.getDate() - ((d.getDay() + 6) % 7));
  return d;
}
function getWeekKey(ts) { return dateStr(mondayOf(ts)); }
function rateClass(r) {
  if (r >= 0.9) return 'acc-good';
  if (r >= 0.75) return 'acc-mid';
  if (r >= 0.6) return 'acc-low';
  return 'acc-bad';
}

/* =====================================================================
   1. 背景漂浮图
   ===================================================================== */
(function initBackground() {
  const layer = $('#bgLayer');
  const imgs = ['P1.jpg', 'P2.jpg', 'P3.jpg'];
  const rnd = (a, b) => a + Math.random() * (b - a);
  for (let i = 0; i < 12; i++) {
    const d = document.createElement('div');
    d.className = 'float-img';
    const size = rnd(120, 340);
    d.style.width = size + 'px';
    d.style.height = size + 'px';
    d.style.left = rnd(-5, 95).toFixed(2) + '%';
    d.style.top  = rnd(-5, 95).toFixed(2) + '%';
    d.style.backgroundImage = `url('${imgs[i % imgs.length]}')`;
    d.style.animationDuration = rnd(48, 115).toFixed(0) + 's';
    d.style.animationDelay = (-rnd(0, 110)).toFixed(0) + 's';
    const s = v => v.toFixed(0) + 'px';
    d.style.setProperty('--dx1', s(rnd(-160, 160)));
    d.style.setProperty('--dy1', s(rnd(-160, 160)));
    d.style.setProperty('--dx2', s(rnd(-220, 220)));
    d.style.setProperty('--dy2', s(rnd(-220, 220)));
    d.style.setProperty('--dx3', s(rnd(-160, 160)));
    d.style.setProperty('--dy3', s(rnd(-160, 160)));
    d.style.setProperty('--rot', rnd(-18, 18).toFixed(1) + 'deg');
    layer.appendChild(d);
  }
})();

/* =====================================================================
   2. Web Audio 铃声
   ===================================================================== */
let _audioCtx = null;
function getAudioCtx() {
  if (!_audioCtx) {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return null;
    try { _audioCtx = new AC(); } catch (e) { return null; }
  }
  if (_audioCtx.state === 'suspended') _audioCtx.resume();
  return _audioCtx;
}
document.addEventListener('pointerdown', () => getAudioCtx(), { once: true });

function playBell(seconds = 5) {
  const ctx = getAudioCtx();
  if (!ctx) return;
  const t0 = ctx.currentTime + 0.03, beat = 0.5;
  const count = Math.floor(seconds / beat);
  for (let i = 0; i < count; i++) {
    const t = t0 + i * beat;
    [0, 0.12].forEach((off, k) => {
      const osc = ctx.createOscillator(), g = ctx.createGain();
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(k === 0 ? 880 : 1318.5, t + off);
      g.gain.setValueAtTime(0.0001, t + off);
      g.gain.linearRampToValueAtTime(0.17, t + off + 0.012);
      g.gain.exponentialRampToValueAtTime(0.0006, t + off + 0.30);
      osc.connect(g); g.connect(ctx.destination);
      osc.start(t + off); osc.stop(t + off + 0.34);
    });
  }
}
function triggerAlarm() {
  const ov = $('#flashOverlay');
  ov.classList.remove('on');
  void ov.offsetWidth;
  ov.classList.add('on');
  setTimeout(() => ov.classList.remove('on'), 5300);
  playBell(5);
}

/* =====================================================================
   3. 时间模式 & 翻页时钟
   ===================================================================== */
const WEEK_CN = ['星期日','星期一','星期二','星期三','星期四','星期五','星期六'];
let lastFlipValues = { h1: -1, h2: -1, m1: -1, m2: -1, s1: -1, s2: -1 };

function createFlipCard(val) {
  return `<div class="flip-card"><span class="num">${val}</span></div>`;
}

function tickClock() {
  const now = new Date();
  const h = now.getHours(), m = now.getMinutes(), s = now.getSeconds();
  
  // 更新普通时钟
  $('#clockHM').textContent = `${pad2(h)}:${pad2(m)}`;
  $('#clockS').textContent  = pad2(s);
  $('#bigDate').textContent = `${now.getFullYear()} 年 ${now.getMonth()+1} 月 ${now.getDate()} 日　${WEEK_CN[now.getDay()]}`;

  // 更新翻页时钟
  if ($('#flipClockOverlay').classList.contains('active')) {
    const timeStr = pad2(h) + pad2(m) + pad2(s);
    const ids = ['h1','h2','m1','m2','s1','s2'];
    const containers = [ $('#flipH'), $('#flipH'), $('#flipM'), $('#flipM'), $('#flipS'), $('#flipS') ];
    const groups = { h: $('#flipH'), m: $('#flipM'), s: $('#flipS') };
    
    // 初始化 DOM（只在第一次创建）
    if (groups.h.innerHTML === '') {
      groups.h.innerHTML = createFlipCard(pad2(h)[0]) + createFlipCard(pad2(h)[1]);
      groups.m.innerHTML = createFlipCard(pad2(m)[0]) + createFlipCard(pad2(m)[1]);
      groups.s.innerHTML = createFlipCard(pad2(s)[0]) + createFlipCard(pad2(s)[1]);
      lastFlipValues = { h1: pad2(h)[0], h2: pad2(h)[1], m1: pad2(m)[0], m2: pad2(m)[1], s1: pad2(s)[0], s2: pad2(s)[1] };
    } else {
      // 更新并触发动画
      const updateCard = (group, index, newVal, oldValKey) => {
        if (lastFlipValues[oldValKey] !== newVal) {
          const card = group.children[index];
          const numSpan = card.querySelector('.num');
          numSpan.textContent = newVal;
          card.classList.remove('flip-anim');
          void card.offsetWidth; // reflow
          card.classList.add('flip-anim');
          lastFlipValues[oldValKey] = newVal;
        }
      };
      updateCard(groups.h, 0, pad2(h)[0], 'h1');
      updateCard(groups.h, 1, pad2(h)[1], 'h2');
      updateCard(groups.m, 0, pad2(m)[0], 'm1');
      updateCard(groups.m, 1, pad2(m)[1], 'm2');
      updateCard(groups.s, 0, pad2(s)[0], 's1');
      updateCard(groups.s, 1, pad2(s)[1], 's2');
    }
    $('#flipDate').textContent = `${now.getFullYear()}年${now.getMonth()+1}月${now.getDate()}日 ${WEEK_CN[now.getDay()]}`;
  }
}

function toggleFlipClock() {
  const overlay = $('#flipClockOverlay');
  if (overlay.classList.contains('active')) {
    overlay.classList.remove('active');
    document.body.style.overflow = '';
    // 尝试退出全屏
    if (document.fullscreenElement) {
      document.exitFullscreen().catch(()=>{});
    }
  } else {
    overlay.classList.add('active');
    document.body.style.overflow = 'hidden';
    $('#flipH').innerHTML = ''; // 强制重新绘制
    tickClock();
    // 尝试进入全屏
    const el = document.documentElement;
    if (el.requestFullscreen) {
      el.requestFullscreen().catch(()=>{});
    }
  }
}

/* =====================================================================
   4. 番茄钟计时核心
   ===================================================================== */
const timer = { mode: 'countdown', totalMs: 25 * 60 * 1000, elapsedBase: 0, runStart: null, running: false };

function loadTimer() {
  const s = store.get(K_TIMER, null);
  if (s && typeof s === 'object') {
    timer.mode = s.mode === 'countup' ? 'countup' : 'countdown';
    timer.totalMs = Number(s.totalMs) || 25 * 60 * 1000;
    timer.elapsedBase = Number(s.elapsedBase) || 0;
    timer.running = !!s.running;
    timer.runStart = s.runStart || null;
    if (timer.running && !timer.runStart) timer.runStart = Date.now();
  }
}
function saveTimer() {
  store.set(K_TIMER, {
    mode: timer.mode, totalMs: timer.totalMs,
    elapsedBase: timer.elapsedBase, runStart: timer.runStart, running: timer.running
  });
}
function elapsed() {
  return timer.elapsedBase + (timer.running ? (Date.now() - timer.runStart) : 0);
}
function resetTimer() {
  timer.running = false; timer.runStart = null; timer.elapsedBase = 0;
  saveTimer(); updateStartBtn(); tickTimer();
}
function toggleTimer() {
  if (timer.running) {
    timer.elapsedBase = elapsed();
    timer.running = false; timer.runStart = null;
  } else {
    if (timer.mode === 'countdown' && timer.elapsedBase >= timer.totalMs) timer.elapsedBase = 0;
    timer.running = true;
    timer.runStart = Date.now();
  }
  saveTimer(); updateStartBtn(); tickTimer();
}
function updateStartBtn() {
  const btn = $('#btnStartPause');
  if (btn) btn.textContent = timer.running ? '暂停' : '开始';
}
function tickTimer() {
  const disp = $('#timerDisplay');
  if (!disp) return;
  const ms = timer.mode === 'countdown' ? Math.max(0, timer.totalMs - elapsed()) : elapsed();
  disp.textContent = fmtMS(ms);
  const bar = $('#progressBar');
  if (timer.mode === 'countdown') {
    bar.style.width = Math.min(1, elapsed() / timer.totalMs) * 100 + '%';
  } else {
    bar.style.width = '100%';
  }
  if (timer.running && timer.mode === 'countdown' && elapsed() >= timer.totalMs) onCountdownEnd();
}
function onCountdownEnd() {
  const dur = timer.totalMs;
  timer.running = false; timer.runStart = null; timer.elapsedBase = timer.totalMs;
  saveTimer(); updateStartBtn(); tickTimer();
  triggerAlarm();
  openRecordModal(dur, resetTimer);
}
function handleFinish() {
  const dur = elapsed();
  if (dur < 1000) { toast('还没有开始计时哦～'); return; }
  timer.running = false; timer.runStart = null;
  saveTimer(); updateStartBtn(); tickTimer();
  triggerAlarm();
  openRecordModal(dur, resetTimer);
}
function setTimerMode(mode) {
  timer.mode = mode; timer.running = false; timer.runStart = null; timer.elapsedBase = 0;
  saveTimer(); updateStartBtn();
  $('#segCountdown').classList.toggle('active', mode === 'countdown');
  $('#segCountup').classList.toggle('active', mode === 'countup');
  tickTimer();
}
function applyMinutes() {
  const v = parseFloat($('#setMinutes').value);
  if (!(v > 0)) { toast('请输入大于 0 的分钟数'); return; }
  timer.totalMs = Math.round(v * 60000);
  timer.running = false; timer.runStart = null; timer.elapsedBase = 0;
  saveTimer(); updateStartBtn(); tickTimer();
  toast('时长已设为 ' + fmtMS(timer.totalMs));
}

/* =====================================================================
   5. 弹窗系统
   ===================================================================== */
let _modalCloseHandler = null;
function openModal(html, onMount) {
  const root = $('#modalRoot');
  root.innerHTML = `<div class="modal-mask"><div class="modal-box">${html}</div></div>`;
  root.classList.add('show');
  const box = root.querySelector('.modal-box');
  let closed = false;
  const close = () => {
    if (closed) return;
    closed = true;
    root.classList.remove('show');
    root.innerHTML = '';
    _modalCloseHandler = null;
  };
  _modalCloseHandler = close;
  root.querySelector('.modal-mask').addEventListener('click', e => {
    if (e.target.classList.contains('modal-mask')) close();
  });
  if (onMount) onMount(box, close);
  return close;
}
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && _modalCloseHandler) _modalCloseHandler();
});

/* =====================================================================
   6. 完成记录表
   ===================================================================== */
let records = store.get(K_REC, []);
if (!Array.isArray(records)) records = [];
records = records.filter(r => r && typeof r === 'object' && r.ts);
function saveRecords() { store.set(K_REC, records); }

function addRecord(name, durationMs, feedback) {
  records.push({ id: uid(), name, durationMs, ts: Date.now(), feedback });
  saveRecords(); renderRecords(); drawPie();
}

function openRecordModal(durationMs, onDone) {
  const last = store.get(K_LASTPJ, '');
  openModal(`
    <h3>✨ 记录本次专注</h3>
    <p class="muted">本次时长：<b>${fmtMS(durationMs)}</b></p>
    <label class="field"><span>项目名称</span>
      <input type="text" id="mPjName" value="${escAttr(last)}" placeholder="例如：行测资料分析">
    </label>
    <label class="field"><span>反馈</span></label>
    <div class="radio-row" style="margin-top:-6px;">
      <label class="radio-chip"><input type="radio" name="mFb" value="pos" checked>正向 楽</label>
      <label class="radio-chip"><input type="radio" name="mFb" value="neg">负向 ▲</label>
    </div>
    <div class="modal-actions">
      <button class="ghost" id="mSkip">跳过</button>
      <button class="primary" id="mSave">保存记录</button>
    </div>
  `, (box, close) => {
    const nameEl = box.querySelector('#mPjName');
    setTimeout(() => nameEl.focus(), 80);
    box.querySelector('#mSave').onclick = () => {
      const name = nameEl.value.trim() || '未命名任务';
      const fb = box.querySelector('input[name="mFb"]:checked').value;
      store.set(K_LASTPJ, name);
      addRecord(name, durationMs, fb);
      close();
      toast('已记录，继续加油 💪');
      if (onDone) onDone();
    };
    box.querySelector('#mSkip').onclick = () => { close(); if (onDone) onDone(); };
  });
}

function openEditRecordModal(id) {
  const r = records.find(x => x.id === id);
  if (!r) return;
  openModal(`
    <h3>✏️ 修改记录</h3>
    <label class="field"><span>项目名称</span>
      <input type="text" id="eName" value="${escAttr(r.name)}">
    </label>
    <label class="field"><span>时长（分钟）</span>
      <input type="number" id="eMin" min="0.1" step="0.1" value="${(r.durationMs / 60000).toFixed(1)}">
    </label>
    <label class="field"><span>反馈</span></label>
    <div class="radio-row" style="margin-top:-6px;">
      <label class="radio-chip"><input type="radio" name="eFb" value="pos" ${r.feedback === 'pos' ? 'checked' : ''}>正向 楽</label>
      <label class="radio-chip"><input type="radio" name="eFb" value="neg" ${r.feedback === 'neg' ? 'checked' : ''}>负向 ▲</label>
    </div>
    <div class="modal-actions">
      <button class="ghost" id="eCancel">取消</button>
      <button class="primary" id="eSave">保存</button>
    </div>
  `, (box, close) => {
    box.querySelector('#eCancel').onclick = close;
    box.querySelector('#eSave').onclick = () => {
      const name = box.querySelector('#eName').value.trim();
      const mins = parseFloat(box.querySelector('#eMin').value);

const PALETTE = ['#4f8cff', '#ff8a5c', '#3ecf8e', '#f7c948', '#a97bff', '#f56aa8', '#33c6d9'];

function getLast7DaysData() {
  const now = Date.now(), from = now - 7 * 864e5;
  const map = new Map();
  records.forEach(r => {
    if (r.ts < from || r.ts > now) return;
    map.set(r.name, (map.get(r.name) || 0) + r.durationMs);
  });
  let arr = [...map.entries()].map(([name, ms]) => ({ name, ms })).sort((a, b) => b.ms - a.ms);
  if (arr.length > 6) {
    const otherMs = arr.slice(6).reduce((s, x) => s + x.ms, 0);
    arr = arr.slice(0, 6).concat([{ name: '其他', ms: otherMs }]);
  }
  return arr;
}

function drawPie() {
  const cv = $('#pieChart');
  if (!cv) return;
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const W = 260, H = 260;
  cv.width = W * dpr; cv.height = H * dpr;
  const ctx = cv.getContext('2d');
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, W, H);

  const legend = $('#pieLegend');
  const data = getLast7DaysData();
  const total = data.reduce((s, d) => s + d.ms, 0);

  if (!data.length || total <= 0) {
    ctx.beginPath();
    ctx.arc(W/2, H/2, 105, 0, Math.PI * 2);
    ctx.lineWidth = 30;
    ctx.strokeStyle = 'rgba(140,160,190,.22)';
    ctx.stroke();
    ctx.fillStyle = 'rgba(140,160,190,.9)';
    ctx.font = '600 13px -apple-system, "PingFang SC", sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('近 7 天暂无记录', W/2, H/2);
    legend.innerHTML = '<div class="empty">开始一次专注，这里就会长出你的饼图啦 🍅</div>';
    return;
  }

  const cx = W/2, cy = H/2, rOut = 108, rIn = 66;
  if (data.length === 1) {
    ctx.beginPath();
    ctx.arc(cx, cy, rOut, 0, Math.PI * 2);
    ctx.moveTo(cx + rIn, cy);
    ctx.arc(cx, cy, rIn, 0, Math.PI * 2);
    ctx.fillStyle = PALETTE[0];
    ctx.fill('evenodd');
  } else {
    let a0 = -Math.PI / 2;
    data.forEach((d, i) => {
      const a1 = a0 + (d.ms / total) * Math.PI * 2;
      ctx.beginPath();
      ctx.arc(cx, cy, rOut, a0, a1);
      ctx.arc(cx, cy, rIn, a1, a0, true);
      ctx.closePath();
      ctx.fillStyle = PALETTE[i % PALETTE.length];
      ctx.fill();
      a0 = a1;
    });
  }

  ctx.fillStyle = 'rgba(120,140,170,.95)';
  ctx.font = '700 12px -apple-system, "PingFang SC", sans-serif';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText('近 7 天', cx, cy - 13);
  ctx.fillStyle = '#3b6ea8';
  ctx.font = '800 17px -apple-system, "PingFang SC", sans-serif';
  ctx.fillText(fmtMS(total), cx, cy + 11);

  legend.innerHTML = data.map((d, i) => {
    const pct = (d.ms / total * 100).toFixed(1);
    return `<div class="legend-item">
      <span class="legend-dot" style="background:${PALETTE[i % PALETTE.length]}"></span>
      <span class="legend-name" title="${escAttr(d.name)}">${escHtml(d.name)}</span>
      <span class="legend-val">${pct}% · ${fmtMS(d.ms)}</span>
    </div>`;
  }).join('');
}

let accRecords = store.get(K_ACC, []);
if (!Array.isArray(accRecords)) accRecords = [];
accRecords = accRecords.filter(r => r && typeof r === 'object' && r.paper != null);
const selectedAccKeys = new Set();

function accKey(paper, type) { return paper + '||' + type; }
function parseKey(k) {
  const i = k.indexOf('||');
  return i < 0 ? [k, ''] : [k.slice(0, i), k.slice(i + 2)];
}

function getAccGroups() {
  const map = new Map();
  accRecords.forEach(r => {
    const key = accKey(r.paper, r.type);
    if (!map.has(key)) map.set(key, { paper: r.paper, type: r.type, count: 0, sumTotal: 0, sumWrong: 0 });
    const g = map.get(key);
    g.count++; g.sumTotal += Number(r.total) || 0; g.sumWrong += Number(r.wrong) || 0;
  });
  return [...map.values()].map(g => ({
    ...g, key: accKey(g.paper, g.type),
    rate: g.sumTotal ? (g.sumTotal - g.sumWrong) / g.sumTotal : 0
  })).sort((a, b) => a.paper.localeCompare(b.paper, 'zh') || a.type.localeCompare(b.type, 'zh'));
}

function refreshPaperList() {
  const list = $('#paperList');
  if (!list) return;
  const papers = [...new Set(accRecords.map(r => r.paper))].sort();
  list.innerHTML = papers.map(p => `<option value="${escAttr(p)}">`).join('');
}

function renderAccTable() {
  refreshPaperList();
  const groups = getAccGroups();
  const body = $('#accBody');
  if (!groups.length) {
    body.innerHTML = `<tr><td colspan="8" class="empty">还没有记录，做完一套题就来生成正确率吧 📊</td></tr>`;
    selectedAccKeys.clear();
    return;
  }
  const validKeys = new Set(groups.map(g => g.key));
  [...selectedAccKeys].forEach(k => { if (!validKeys.has(k)) selectedAccKeys.delete(k); });

  body.innerHTML = groups.map(g => {
    const enc = escAttr(encodeURIComponent(g.key));
    return `<tr>
      <td><input type="checkbox" data-key="${enc}" ${selectedAccKeys.has(g.key) ? 'checked' : ''}></td>
      <td>${escHtml(g.paper)}</td>
      <td>${escHtml(g.type)}</td>
      <td>${g.count}</td>
      <td>${g.sumTotal}</td>
      <td>${g.sumWrong}</td>
      <td class="${rateClass(g.rate)}">${(g.rate * 100).toFixed(1)}%</td>
      <td class="op-cell">
        <button class="ghost mini" data-act="edit-acc" data-key="${enc}">编辑</button>
        <button class="ghost mini danger" data-act="del-acc" data-key="${enc}">删除</button>
      </td>
    </tr>`;
  }).join('');
}

$('#accBody').addEventListener('change', e => {
  const cb = e.target.closest('input[type=checkbox]');
  if (!cb) return;
  const key = decodeURIComponent(cb.dataset.key);
  if (cb.checked) selectedAccKeys.add(key); else selectedAccKeys.delete(key);
});

$('#accBody').addEventListener('click', e => {
  const btn = e.target.closest('button[data-act]');
  if (!btn) return;
  const key = decodeURIComponent(btn.dataset.key);
  const [paper, type] = parseKey(key);

  if (btn.dataset.act === 'edit-acc') {
    openModal(`
      <h3>✏️ 修改分组名称</h3>
      <p class="muted">将同步修改该分组下的所有记录
      <label class="field"><span>试卷名称</span>
        <input type="text" id="ePaper" value="${escAttr(paper)}"></label>
      <label class="field"><span>题目类型</span>
        <input type="text" id="eType" value="${escAttr(type)}" list="typeList"></label>
      <div class="modal-actions">
        <button class="ghost" id="eCancel">取消</button>
        <button class="primary" id="eSave">保存</button>
      </div>
    `, (box, close) => {
      box.querySelector('#eCancel').onclick = close;
      box.querySelector('#eSave').onclick = () => {
        const np = box.querySelector('#ePaper').value.trim();

        });
        store.set(K_ACC, accRecords);
        selectedAccKeys.delete(key);
        close(); renderAccTable();
        toast('已修改');
      };
    });
  }

  if (btn.dataset.act === 'del-acc') {
    const n = accRecords.filter(r => accKey(r.paper, r.type) === key).length;
    if (!confirm(`确定删除「${paper} · ${type}」下的 ${n} 条记录吗？`)) return;
    accRecords = accRecords.filter(r => accKey(r.paper, r.type) !== key);
    store.set(K_ACC, accRecords);

function updateAccLive() {

/* ---- 分析 ---- */
const CHEERS = [
  '你已经比昨天的自己更棒啦，继续保持这份节奏 🌟',
  '薄弱模块只是还没被点亮的地图，多刷几套就熟啦 🗺️',
  '每一次复盘，都是在给未来的自己攒运气 🍀',
  '别着急，稳稳地走，你正在进步的路上 🐢💨',
  '小步快跑，积累起来就是大大的跨越 ✨',
  '错题是宝藏，挖得越多，分数越亮 💎',
  '今天多练一道，考场上就多一分从容 🌈'
];

function analyzeSelected() {
  if (!selectedAccKeys.size) { toast('请先勾选要分析的试卷 / 题型'); return; }
  const recs = accRecords.filter(r => selectedAccKeys.has(accKey(r.paper, r.type)));
  if (!recs.length) { toast('选中的分组没有记录'); return; }

  const sumT = recs.reduce((s, r) => s + (Number(r.total) || 0), 0);
  const sumW = recs.reduce((s, r) => s + (Number(r.wrong) || 0), 0);
  const overall = sumT ? (sumT - sumW) / sumT : 0;

  const byType = new Map();
  recs.forEach(r => {
    if (!byType.has(r.type)) byType.set(r.type, { type: r.type, total: 0, wrong: 0, items: [] });
    const g = byType.get(r.type);
    g.total += Number(r.total) || 0;
    g.wrong += Number(r.wrong) || 0;
    g.items.push(r);
  });
  const typeArr = [...byType.values()].map(g => ({
    ...g, rate: g.total ? (g.total - g.wrong) / g.total : 0
  })).sort((a, b) => a.rate - b.rate);

  const papers = [...new Set(recs.map(r => r.paper))];

  let html = `<h4>🔍 数据分析</h4>`;
  html += `<div>分析范围：<b>${papers.length}</b> 套试卷 · <b>${typeArr.length}</b> 个题型 · <b>${recs.length}</b> 条记录。</div>`;
  html += `<div>累计 <b>${sumT}</b> 题，错 <b>${sumW}</b> 题，综合正确率 <b class="${rateClass(overall)}">${(overall * 100).toFixed(1)}%</b>。</div>`;

  if (typeArr.length > 1) {
    const weak = typeArr[0], strong = typeArr[typeArr.length - 1];
    html += `<div>📌 最需要加强的是 <span class="tag">${escHtml(weak.type)}</span>（正确率 ${(weak.rate * 100).toFixed(1)}%），建议接下来重点安排几套专项练习。</div>`;
    html += `<div>🏅 表现最稳的是 <span class="tag">${escHtml(strong.type)}</span>（正确率 ${(strong.rate * 100).toFixed(1)}%），保持手感就好。</div>`;
  } else if (typeArr.length === 1) {
    html += `<div>📌 当前只涉及 <span class="tag">${escHtml(typeArr[0].type)}</span>，正确率 ${(typeArr[0].rate * 100).toFixed(1)}%，可以再补充其他题型一起对比。</div>`;
  }

  const trends = [];
  typeArr.forEach(g => {
    if (g.items.length < 2) return;
    const sorted = g.items.slice().sort((a, b) => a.ts - b.ts);
    const half = Math.floor(sorted.length / 2);
    const rateOf = arr => {
      const t = arr.reduce((s, r) => s + (Number(r.total) || 0), 0);
      const w = arr.reduce((s, r) => s + (Number(r.wrong) || 0), 0);
      return t ? (t - w) / t : 0;
    };
    const r1 = rateOf(sorted.slice(0, half));
    const r2 = rateOf(sorted.slice(half));
    trends.push({ type: g.type, d: r2 - r1, r1, r2 });
  });
  trends.sort((a, b) => b.d - a.d);

  if (trends.length) {
    html += `<div style="margin-top:8px;">📈 题型趋势：</div>`;
    trends.forEach(t => {
      const p1 = (t.r1 * 100).toFixed(1), p2 = (t.r2 * 100).toFixed(1);
      if (t.d > 0.03) {
        html += `<div>　<span class="tag">${escHtml(t.type)}</span> ${p1}% → ${p2}% <span class="arrow-up">▲ 进步中</span>，继续冲！</div>`;
      } else if (t.d < -0.03) {
        html += `<div>　<span class="tag">${escHtml(t.type)}</span> ${p1}% → ${p2}% <span class="arrow-down">▼ 略有回落</span>，仍需努力，回头看看错题吧。</div>`;
      } else {
        html += `<div>　<span class="tag">${escHtml(t.type)}</span> ${p1}% → ${p2}% 基本持平，稳扎稳打。</div>`;
      }
    });
  }

  html += `<div class="cheer">${CHEERS[Math.floor(Math.random() * CHEERS.length)]}</div>`;
  $('#analysisBox').innerHTML = `<div class="analysis-box">${html}</div>`;
  $('#analysisBox').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}

  ta.value = '';
  renderStickies();
  toast('便签已添加 📌');
}

/* =====================================================================
   10. 主题 / 模式切换 / 全屏
   ===================================================================== */
function applyTheme(dark) {
  document.body.classList.toggle('dark', dark);
  $('#themeIcon').textContent = dark ? '☀️' : '🌙';
  store.set(K_THEME, dark);
}

function switchMode(mode) {
  if (!['time', 'pomo', 'acc'].includes(mode)) mode = 'time';
  document.body.dataset.mode = mode;
  $$('.tabs button').forEach(b => b.classList.toggle('active', b.dataset.mode === mode));
  $$('.view').forEach(v => v.classList.toggle('active', v.id === 'view-' + mode));
  store.set(K_MODE, mode);
  
  if (mode === 'pomo') {
    tickTimer();
    renderRecords();
    drawPie();
  }
  if (mode === 'acc') {
    renderAccTable();
  }
}

function toggleFullscreen() {
  const doc = window.document;
  const el = doc.documentElement;
  if (!doc.fullscreenElement && !doc.webkitFullscreenElement && !doc.mozFullScreenElement && !doc.msFullscreenElement) {
    if (el.requestFullscreen) { el.requestFullscreen().catch(()=>{}); }
    else if (el.webkitRequestFullscreen) { el.webkitRequestFullscreen(); }
    else if (el.mozRequestFullScreen) { el.mozRequestFullScreen(); }
    else if (el.msRequestFullscreen) { el.msRequestFullscreen(); }
  } else {
    if (doc.exitFullscreen) { doc.exitFullscreen().catch(()=>{}); }
    else if (doc.webkitExitFullscreen) { doc.webkitExitFullscreen(); }
    else if (doc.mozCancelFullScreen) { doc.mozCancelFullScreen(); }
    else if (doc.msExitFullscreen) { doc.msExitFullscreen(); }
  }
}

/* =====================================================================
   11. 事件绑定 & 初始化
   ===================================================================== */
function bindEvents() {
  $$('.tabs button').forEach(btn => {
    btn.addEventListener('click', () => switchMode(btn.dataset.mode));
  });

  $('#btnTheme').addEventListener('click', () => {
    applyTheme(!document.body.classList.contains('dark'));
  });
  
  $('#btnFullscreen').addEventListener('click', toggleFullscreen);
  $('#btnFlipMode').addEventListener('click', toggleFlipClock);
  $('#flipCloseBtn').addEventListener('click', toggleFlipClock);

  $('#btnSticky').addEventListener('click', () => {
    $('#drawer').classList.add('open');
    renderStickies();
  });
  $('#btnCloseDrawer').addEventListener('click', () => {
    $('#drawer').classList.remove('open');
  });
  $('#btnAddSticky').addEventListener('click', addSticky);
  $('#stickyInput').addEventListener('keydown', e => {
    if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') { e.preventDefault(); addSticky(); }
  });

  $('#segCountdown').addEventListener('click', () => setTimerMode('countdown'));
  $('#segCountup').addEventListener('click', () => setTimerMode('countup'));
  $('#btnStartPause').addEventListener('click', toggleTimer);
  $('#btnReset').addEventListener('click', resetTimer);
  $('#btnFinish').addEventListener('click', handleFinish);
  $('#btnApplySet').addEventListener('click', applyMinutes);
  $('#setMinutes').addEventListener('keydown', e => {
    if (e.key === 'Enter') { e.preventDefault(); applyMinutes(); }
  });

  $('#weekSelect').addEventListener('change', renderRecords);
  $('#btnExportCSV').addEventListener('click', exportCSV);

  $('#btnGenAcc').addEventListener('click', genAcc);
  $('#btnAnalyze').addEventListener('click', analyzeSelected);
  $('#btnCheckAll').addEventListener('click', () => {
    const groups = getAccGroups();
    if (!groups.length) { toast('还没有可分析的分组'); return; }
    const allSelected = groups.every(g => selectedAccKeys.has(g.key));
    selectedAccKeys.clear();
    if (!allSelected) groups.forEach(g => selectedAccKeys.add(g.key));
    renderAccTable();
  });

  document.addEventListener('keydown', e => {
    if (e.code !== 'Space') return;
    if (document.body.dataset.mode !== 'pomo') return;
    const tag = (e.target.tagName || '').toLowerCase();
    if (['input', 'textarea', 'select', 'button'].includes(tag)) return;
    if (e.target.isContentEditable) return;
    if ($('#modalRoot').classList.contains('show')) return;
    e.preventDefault();
    toggleTimer();
  });

  document.addEventListener('visibilitychange', () => {
    if (!document.hidden) {
      tickClock();
      tickTimer();
      if (document.body.dataset.mode === 'pomo') drawPie();
    }
  });
  window.addEventListener('focus', () => { tickClock(); tickTimer(); });
}

function init() {
  applyTheme(store.get(K_THEME, false));
  loadTimer();
  updateStartBtn();
  tickTimer();

  const mins = Math.round(timer.totalMs / 60000);
  const setEl = $('#setMinutes');
  if (setEl) setEl.value = mins > 0 ? mins : 25;

  $('#segCountdown').classList.toggle('active', timer.mode === 'countdown');
  $('#segCountup').classList.toggle('active', timer.mode === 'countup');

  tickClock();
  renderRecords();
  drawPie();
  renderAccTable();
  renderStickies();

  switchMode(store.get(K_MODE, 'time'));
  bindEvents();

  setInterval(tickClock, 1000);
  setInterval(tickTimer, 100);
}

document.addEventListener('DOMContentLoaded', init);
</script>
</body>
</html>
